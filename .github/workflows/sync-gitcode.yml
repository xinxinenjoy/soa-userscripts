name: Sync Latest Repository to GitCode

env:
  GITHUB_BRANCH: main
  PUBLISH_DIR: publish
  README_FILE: README.md

  GITCODE_OWNER: gcw_7DpHPfUr
  GITCODE_REPO: wanxin-userscripts
  GITCODE_BRANCH: main
  GITCODE_SECRET_NAME: GITCODE_TOKEN

on:
  # README 完成后再同步。
  # GitCode 只承担国内脚本分发，不再镜像完整开发仓库。
  workflow_run:
    workflows:
      - "Update Userscripts README"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-latest-repository-gitcode
  cancel-in-progress: true

jobs:
  sync-gitcode:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          # 这里只需要当前最终文件，不需要 GitHub 历史记录。
          fetch-depth: 1
          path: source

      - name: Validate Distribution Files
        shell: bash
        run: |
          set -euo pipefail

          echo "即将同步的 GitHub 最新提交："
          git -C source log -1 --oneline
          echo ""

          if [ ! -d "source/${PUBLISH_DIR}" ]; then
            echo "::error::找不到 source/${PUBLISH_DIR}，无法同步正式发布脚本。"
            exit 1
          fi

          SCRIPT_COUNT="$(find "source/${PUBLISH_DIR}" -type f -name '*.user.js' | wc -l | tr -d ' ')"

          if [ "${SCRIPT_COUNT}" -eq 0 ]; then
            echo "::error::publish/ 中没有 .user.js 文件。"
            exit 1
          fi

          if [ ! -f "source/${README_FILE}" ]; then
            echo "::error::找不到 source/${README_FILE}。"
            exit 1
          fi

          echo "正式发布脚本：${SCRIPT_COUNT} 个"
          echo "GitCode 将只保留："
          echo "  - ${PUBLISH_DIR}/"
          echo "  - ${README_FILE}"

      - name: Check GitCode Secret
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        shell: bash
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "::error::未读取到 GitCode Token：${GITCODE_SECRET_NAME}"
            exit 1
          fi

          echo "GitCode Token 已读取。"

      - name: Configure GitCode Authentication
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        shell: bash
        run: |
          cat > ~/.netrc <<EOF_NETRC
          machine gitcode.com
          login ${GITCODE_OWNER}
          password ${GITCODE_TOKEN}
          EOF_NETRC

          chmod 600 ~/.netrc

      - name: Shallow Clone GitCode With Retry
        shell: bash
        run: |
          set -euo pipefail

          REPO_URL="https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git"
          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "GitCode 浅克隆，第 ${ATTEMPT}/3 次尝试..."
            rm -rf gitcode

            if git -c http.version=HTTP/1.1 clone \
              --depth 1 \
              --single-branch \
              --no-tags \
              --branch "${GITCODE_BRANCH}" \
              "${REPO_URL}" \
              gitcode; then
              SUCCESS=1
              break
            fi

            echo "::warning::GitCode 克隆失败，稍后自动重试。"
            sleep $((ATTEMPT * 8))
          done

          if [ "${SUCCESS}" -ne 1 ]; then
            echo "::error::GitCode 连续 3 次浅克隆失败。"
            exit 1
          fi

          echo "GitCode 浅克隆成功。"

      - name: Build Minimal GitCode Distribution
        shell: bash
        run: |
          set -euo pipefail

          # GitCode 只作为国内发布仓库。
          # 清理旧的源代码、Workflow 等镜像内容，只保留 README + publish/。
          find gitcode \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name "${PUBLISH_DIR}" \
            ! -name "${README_FILE}" \
            -exec rm -rf {} +

          mkdir -p "gitcode/${PUBLISH_DIR}"

          rsync -a --delete \
            "source/${PUBLISH_DIR}/" \
            "gitcode/${PUBLISH_DIR}/"

          cp \
            "source/${README_FILE}" \
            "gitcode/${README_FILE}"

          echo "GitCode 分发目录已准备完成。"

      - name: Commit and Push GitCode With Retry
        shell: bash
        run: |
          set -euo pipefail

          cd gitcode

          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitCode 已经是最新分发状态，无需提交。"
            exit 0
          fi

          SOURCE_SHA="$(git -C ../source rev-parse --short HEAD)"
          git commit -m "Sync userscript distribution ${SOURCE_SHA}"

          SUCCESS=0

          for ATTEMPT in 1 2 3; do
            echo "GitCode Push，第 ${ATTEMPT}/3 次尝试..."

            if git -c http.version=HTTP/1.1 push origin "${GITCODE_BRANCH}"; then
              SUCCESS=1
              break
            fi

            echo "::warning::GitCode Push 失败，稍后自动重试。"
            sleep $((ATTEMPT * 8))
          done

          if [ "${SUCCESS}" -ne 1 ]; then
            echo "::error::GitCode 连续 3 次 Push 失败。"
            exit 1
          fi

          echo "GitCode 国内分发仓库同步完成。"

      - name: Check GitCode Raw Refresh
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          echo "检查 GitCode Raw 是否已经刷新到本次版本。"
          echo "该步骤仅用于提示 CDN 缓存状态，不影响同步结果。"

          STALE=0
          CHECKED=0

          while IFS= read -r -d '' FILE; do
            RELATIVE="${FILE#source/}"
            LOCAL_VERSION="$(
              sed -n 's#^[[:space:]]*//[[:space:]]*@version[[:space:]]\+##p' "${FILE}" \
                | head -n 1 \
                | tr -d '\r' \
                | xargs
            )"

            [ -n "${LOCAL_VERSION}" ] || continue

            URL="https://raw.gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/raw/${GITCODE_BRANCH}/${RELATIVE}"
            MATCHED=0
            CHECKED=$((CHECKED + 1))

            for ATTEMPT in 1 2 3 4 5 6; do
              REMOTE_TEXT="$(
                curl -fsSL \
                  --connect-timeout 12 \
                  --max-time 20 \
                  -H 'Cache-Control: no-cache' \
                  "${URL}" \
                  2>/dev/null || true
              )"

              REMOTE_VERSION="$(
                printf '%s\n' "${REMOTE_TEXT}" \
                  | sed -n 's#^[[:space:]]*//[[:space:]]*@version[[:space:]]\+##p' \
                  | head -n 1 \
                  | tr -d '\r' \
                  | xargs
              )"

              if [ "${REMOTE_VERSION}" = "${LOCAL_VERSION}" ]; then
                MATCHED=1
                echo "✅ ${RELATIVE} -> ${LOCAL_VERSION}"
                break
              fi

              echo "等待 Raw 刷新：${RELATIVE} 本地=${LOCAL_VERSION} 远程=${REMOTE_VERSION:-无法读取}"
              sleep 10
            done

            if [ "${MATCHED}" -ne 1 ]; then
              STALE=$((STALE + 1))
              echo "::warning::${RELATIVE} 的 GitCode Raw 暂未刷新到 ${LOCAL_VERSION}。"
            fi
          done < <(find "source/${PUBLISH_DIR}" -type f -name '*.user.js' -print0)

          echo ""
          echo "Raw 检查完成：共 ${CHECKED} 个脚本，暂未刷新 ${STALE} 个。"

          if [ "${STALE}" -gt 0 ]; then
            echo "::warning::GitCode 仓库已经同步成功，但部分 Raw 地址仍可能处于 CDN 缓存期。"
          fi

      - name: Sync Summary
        shell: bash
        run: |
          SCRIPT_COUNT="$(find "source/${PUBLISH_DIR}" -type f -name '*.user.js' | wc -l | tr -d ' ')"

          {
            echo "## GitCode 国内分发同步"
            echo
            echo "✅ README 已生成"
            echo
            echo "✅ 正式发布脚本：${SCRIPT_COUNT} 个"
            echo
            echo "✅ GitCode 仅同步 \`${PUBLISH_DIR}/\` + \`${README_FILE}\`"
            echo
            echo "✅ GitCode 使用浅克隆，并对 Clone / Push 自动重试 3 次"
            echo
            echo "GitHub 提交：\`$(git -C source rev-parse --short HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

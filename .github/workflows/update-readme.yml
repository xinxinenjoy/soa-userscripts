                border-color: #ef9ca0;
                box-shadow: 0 0 0 4px rgba(229, 72, 77, .08);
              }}

              .filters {{
                display: flex;
                gap: 8px;
                overflow-x: auto;
                scrollbar-width: none;
              }}

              .filters::-webkit-scrollbar {{
                display: none;
              }}

              .filter {{
                padding: 10px 14px;
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--muted);
                background: #fff;
                cursor: pointer;
                white-space: nowrap;
              }}

              .filter.active {{
                color: #fff;
                border-color: var(--accent);
                background: var(--accent);
              }}

              .scripts-content {{
                padding: 8px 0 42px;
              }}

              .script-grid {{
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
              }}

              .script-card {{
                display: flex;
                min-height: 246px;
                flex-direction: column;
                padding: 23px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: var(--panel);
                box-shadow: 0 8px 22px rgba(23, 28, 38, .035);
                transition:
                  transform .16s ease,
                  box-shadow .16s ease;
              }}

              .script-card:hover {{
                transform: translateY(-2px);
                box-shadow: var(--shadow);
              }}

              .script-card.hidden {{
                display: none;
              }}

              .script-card-head {{
                display: flex;
                gap: 14px;
                align-items: flex-start;
                justify-content: space-between;
              }}

              .script-title-wrap {{
                min-width: 0;
              }}

              .script-category {{
                color: var(--accent);
                font-size: 12px;
                font-weight: 800;
              }}

              .script-card h3 {{
                margin: 7px 0 0;
                font-size: 20px;
                line-height: 1.45;
              }}

              .script-version {{
                flex: 0 0 auto;
                padding: 6px 10px;
                border-radius: 999px;
                color: var(--accent);
                background: var(--accent-soft);
                font-size: 12px;
                font-weight: 800;
              }}

              .script-description {{
                margin: 15px 0 0;
                color: var(--muted);
                line-height: 1.72;
              }}

              .script-meta {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px 15px;
                margin-top: auto;
                padding-top: 18px;
                color: #969ca9;
                font-size: 12px;
              }}

              .script-actions {{
                display: flex;
                gap: 10px;
                margin-top: 17px;
              }}

              .guide {{
                margin-bottom: 56px;
                padding: 26px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: #fff;
              }}

              .guide h2 {{
                margin: 0 0 12px;
                font-size: 23px;
              }}

              details {{
                padding: 14px 0;
                border-top: 1px solid var(--line);
              }}

              details:first-of-type {{
                border-top: 0;
              }}

              summary {{
                cursor: pointer;
                font-weight: 750;
              }}

              details p,
              details ol {{
                color: var(--muted);
                line-height: 1.8;
              }}

              .empty {{
                display: none;
                padding: 52px 0;
                text-align: center;
                color: var(--muted);
              }}

              .footer {{
                padding: 0 0 38px;
                text-align: center;
                color: #999fab;
                font-size: 13px;
              }}

              @media (max-width: 900px) {{
                .tm-grid {{
                  grid-template-columns: 1fr;
                }}

                .steps {{
                  grid-template-columns: 1fr;
                }}
              }}

              @media (max-width: 760px) {{
                .hero {{
                  padding-top: 24px;
                }}

                .hero-panel {{
                  padding: 27px 21px;
                }}

                .brand-mark {{
                  width: 46px;
                  height: 46px;
                }}

                .section-head {{
                  align-items: flex-start;
                  flex-direction: column;
                  gap: 5px;
                }}

                .toolbar-inner {{
                  flex-wrap: wrap;
                }}

                .search {{
                  flex-basis: 100%;
                  width: 100%;
                }}

                .filters {{
                  width: 100%;
                }}

                .script-grid {{
                  grid-template-columns: 1fr;
                }}

                .script-actions {{
                  flex-direction: column;
                }}

                .script-actions .button {{
                  width: 100%;
                }}
              }}
            </style>
          </head>

          <body>
            <header class="hero">
              <div class="wrap">
                <div class="hero-panel">
                  <div class="brand-row">
                    <div class="brand-mark" aria-hidden="true">
                      <span></span><span></span>
                    </div>
                    <div>
                      <p class="eyebrow">Userscript Center</p>
                      <h1>WanXin Userscripts</h1>
                    </div>
                  </div>

                  <p class="hero-copy">
                    一个用于集中发布和维护 Tampermonkey 用户脚本的轻量主页。
                    先安装脚本管理器，再点击下方脚本的“立即安装”即可使用；
                    已安装脚本会通过固定地址自动检查后续更新。
                  </p>

                  <div class="hero-actions">
                    <a class="button button-primary" href="#tampermonkey">
                      先安装 Tampermonkey
                    </a>
                    <a class="button button-secondary" href="#scripts">
                      浏览脚本
                    </a>
                    <a class="button button-secondary"
                       href="{h(GITHUB_REPO_URL)}"
                       target="_blank"
                       rel="noopener noreferrer">
                      GitHub 源码
                    </a>
                  </div>

                  <div class="hero-stats">
                    <span class="stat-pill"><strong>{len(items)}</strong> 个正式脚本</span>
                    <span class="stat-pill">最近更新 <strong>{h(latest_text)}</strong></span>
                    <span class="stat-pill">支持 Tampermonkey 自动更新</span>
                  </div>
                </div>
              </div>
            </header>

            <section class="section">
              <div class="wrap">
                <div class="steps">
                  <div class="step">
                    <span class="step-number">1</span>
                    <div>
                      <strong>安装 Tampermonkey</strong>
                      <p>按你的浏览器点击官方商店安装。</p>
                    </div>
                  </div>

                  <div class="step">
                    <span class="step-number">2</span>
                    <div>
                      <strong>选择需要的脚本</strong>
                      <p>找到脚本后点击“立即安装”。</p>
                    </div>
                  </div>

                  <div class="step">
                    <span class="step-number">3</span>
                    <div>
                      <strong>后续自动更新</strong>
                      <p>脚本通过固定更新地址获取新版。</p>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            <section class="section" id="tampermonkey">
              <div class="wrap">
                <div class="section-head">
                  <div>
                    <h2 class="section-title">安装 Tampermonkey</h2>
                    <p class="section-desc">
                      下面按钮直接前往对应浏览器的官方扩展商店。

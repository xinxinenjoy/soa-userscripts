                  </div>
                </div>

                <div class="tm-panel">
                  <div class="tm-grid">
                    <article class="tm-card" data-browser="chrome">
                      <div class="tm-card-top">
                        <div class="tm-logo" aria-hidden="true">
                          <span></span><span></span>
                        </div>
                        <div>
                          <h3 class="tm-name">Tampermonkey</h3>
                          <div class="tm-browser">Chrome 120+</div>
                        </div>
                      </div>
                      <div class="tm-meta">正式版 · 免费 · 多语言</div>
                      <a class="store-button"
                         href="{h(TAMPERMONKEY_CHROME)}"
                         target="_blank"
                         rel="noopener noreferrer">
                        去 Chrome 商店
                      </a>
                    </article>

                    <article class="tm-card" data-browser="edge">
                      <div class="tm-card-top">
                        <div class="tm-logo" aria-hidden="true">
                          <span></span><span></span>
                        </div>
                        <div>
                          <h3 class="tm-name">Tampermonkey</h3>
                          <div class="tm-browser">Microsoft Edge 79+</div>
                        </div>
                      </div>
                      <div class="tm-meta">正式版 · 免费 · 多语言</div>
                      <a class="store-button"
                         href="{h(TAMPERMONKEY_EDGE)}"
                         target="_blank"
                         rel="noopener noreferrer">
                        去 Edge 商店
                      </a>
                    </article>

                    <article class="tm-card" data-browser="firefox">
                      <div class="tm-card-top">

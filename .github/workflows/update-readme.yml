            <script>
              (() => {{
                const search = document.getElementById("search");
                const cards = [...document.querySelectorAll(".script-card")];
                const seriesGroups = [...document.querySelectorAll(".series-group")];
                const folderGroups = [...document.querySelectorAll(".folder-group")];
                const filters = [...document.querySelectorAll(".filter")];
                const empty = document.getElementById("empty");
                const ua = navigator.userAgent;
                const statsSection = document.getElementById("usage-stats");
                const statsVisits = document.getElementById("stats-visits");
                const statsInstalls = document.getElementById("stats-installs");
                const statsRegion = document.getElementById("stats-region");
                const regionSummary = document.getElementById("region-summary");
                const regionChips = document.getElementById("region-chips");
                const statsDetails = document.getElementById("stats-details");
                const trendCanvas = document.getElementById("trend-chart");
                const topScriptsList = document.getElementById("top-scripts");
                const topCitiesList = document.getElementById("top-cities");
                const installLinks = [...document.querySelectorAll(".script-install-link")];
                const scriptNameMap = new Map(
                  cards.map(card => [
                    card.dataset.scriptId,
                    card.querySelector("h3")?.textContent?.trim() || card.dataset.scriptId
                  ])
                );

                let activeGroup = "all";
                let trendData = [];
                let browser = "";

                if (ua.includes("Edg/")) {{
                  browser = "edge";
                }} else if (ua.includes("Firefox/")) {{
                  browser = "firefox";
                }} else if (ua.includes("Chrome/") || ua.includes("Chromium/")) {{
                  browser = "chrome";
                }}

                if (browser) {{
                  const recommended = document.querySelector(
                    '.tm-card[data-browser="' + browser + '"]'
                  );

                  if (recommended) {{
                    recommended.classList.add("recommended");
                  }}
                }}

                function formatNumber(value) {{
                  const number = Number(value);

                  if (!Number.isFinite(number)) {{
                    return "-";
                  }}

                  return new Intl.NumberFormat("zh-CN").format(number);
                }}

                function trackEvent(eventType, scriptId = "") {{
                  const payload = JSON.stringify({{
                    eventType,
                    scriptId
                  }});

                  if (navigator.sendBeacon) {{
                    try {{
                      navigator.sendBeacon("/api/track", payload);
                      return;
                    }} catch (_) {{
                    }}
                  }}

                  fetch("/api/track", {{
                    method: "POST",
                    headers: {{
                      "Content-Type": "application/json"
                    }},
                    body: payload,
                    keepalive: true
                  }}).catch(() => {{}});
                }}

                function niceMax(value) {{
                  const n = Math.max(1, Number(value) || 1);
                  const power = Math.pow(10, Math.floor(Math.log10(n)));
                  const normalized = n / power;

                  let nice = 1;
                  if (normalized <= 1) nice = 1;
                  else if (normalized <= 2) nice = 2;
                  else if (normalized <= 5) nice = 5;
                  else nice = 10;

                  return nice * power;
                }}

                function shortDate(value) {{
                  const parts = String(value || "").split("-");
                  if (parts.length !== 3) return value || "";
                  return Number(parts[1]) + "/" + Number(parts[2]);
                }}

                function drawTrendChart() {{
                  if (!trendCanvas || !trendData.length) {{
                    return;
                  }}

                  const rect = trendCanvas.getBoundingClientRect();
                  const width = Math.max(320, rect.width || 640);
                  const height = Math.max(200, rect.height || 238);
                  const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2));

                  trendCanvas.width = Math.round(width * dpr);
                  trendCanvas.height = Math.round(height * dpr);

                  const ctx = trendCanvas.getContext("2d");
                  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                  ctx.clearRect(0, 0, width, height);

                  const padding = {{
                    top: 16,
                    right: 12,
                    bottom: 30,
                    left: 42
                  }};

                  const chartWidth = width - padding.left - padding.right;
                  const chartHeight = height - padding.top - padding.bottom;

                  const maxValue = niceMax(
                    Math.max(
                      1,
                      ...trendData.map(item => Number(item.visits) || 0),
                      ...trendData.map(item => Number(item.installs) || 0)
                    )
                  );

                  const gridCount = 4;

                  ctx.lineWidth = 1;
                  ctx.font = "11px system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif";
                  ctx.textBaseline = "middle";

                  for (let i = 0; i <= gridCount; i++) {{
                    const ratio = i / gridCount;
                    const y = padding.top + chartHeight * ratio;
                    const value = Math.round(maxValue * (1 - ratio));

                    ctx.beginPath();
                    ctx.strokeStyle = "#eceef2";
                    ctx.moveTo(padding.left, y);
                    ctx.lineTo(width - padding.right, y);
                    ctx.stroke();

                    ctx.fillStyle = "#969ca9";
                    ctx.textAlign = "right";
                    ctx.fillText(
                      new Intl.NumberFormat("zh-CN", {{
                        notation: value >= 10000 ? "compact" : "standard",
                        maximumFractionDigits: 1
                      }}).format(value),
                      padding.left - 8,
                      y
                    );
                  }}

                  const pointX = index => {{
                    if (trendData.length <= 1) return padding.left;
                    return padding.left +
                      (chartWidth * index) / (trendData.length - 1);
                  }};

                  const pointY = value => {{
                    const ratio = Math.max(0, Math.min(1, Number(value || 0) / maxValue));
                    return padding.top + chartHeight * (1 - ratio);
                  }};

                  const labelIndexes = new Set([
                    0,
                    Math.floor((trendData.length - 1) / 3),
                    Math.floor(((trendData.length - 1) * 2) / 3),
                    trendData.length - 1
                  ]);

                  ctx.fillStyle = "#969ca9";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "top";

                  trendData.forEach((item, index) => {{
                    if (!labelIndexes.has(index)) return;
                    ctx.fillText(
                      shortDate(item.date),
                      pointX(index),
                      height - padding.bottom + 9
                    );
                  }});

                  function drawLine(key, color) {{
                    ctx.beginPath();
                    ctx.lineWidth = 2.25;
                    ctx.lineJoin = "round";
                    ctx.lineCap = "round";
                    ctx.strokeStyle = color;

                    trendData.forEach((item, index) => {{
                      const x = pointX(index);
                      const y = pointY(item[key]);

                      if (index === 0) ctx.moveTo(x, y);
                      else ctx.lineTo(x, y);
                    }});

                    ctx.stroke();

                    trendData.forEach((item, index) => {{
                      const x = pointX(index);
                      const y = pointY(item[key]);

                      ctx.beginPath();
                      ctx.fillStyle = "#fff";
                      ctx.strokeStyle = color;
                      ctx.lineWidth = 1.7;
                      ctx.arc(x, y, 2.7, 0, Math.PI * 2);
                      ctx.fill();
                      ctx.stroke();
                    }});
                  }}

                  drawLine("visits", "#e5484d");
                  drawLine("installs", "#4d78df");
                }}

                function renderRanking(container, items, nameResolver) {{
                  if (!container) return;

                  container.innerHTML = "";

                  const source = Array.isArray(items) ? items.slice(0, 5) : [];

                  if (!source.length) {{
                    const emptyItem = document.createElement("li");
                    emptyItem.className = "ranking-empty";
                    emptyItem.textContent = "暂无数据";
                    container.appendChild(emptyItem);
                    return;
                  }}

                  source.forEach((item, index) => {{
                    const li = document.createElement("li");
                    li.className = "ranking-item";

                    const rank = document.createElement("span");
                    rank.className = "ranking-index";
                    rank.textContent = String(index + 1);

                    const name = document.createElement("span");
                    name.className = "ranking-name";
                    name.textContent = nameResolver(item);

                    const count = document.createElement("span");
                    count.className = "ranking-count";
                    count.textContent = formatNumber(item.count) + " 次";

                    li.append(rank, name, count);
                    container.appendChild(li);
                  }});
                }}

                async function loadStats() {{
                  try {{
                    const response = await fetch("/api/stats", {{
                      cache: "no-store"
                    }});

                    if (!response.ok) {{
                      return;
                    }}

                    const data = await response.json();
                    const hasVisits = Number.isFinite(Number(data.totalVisits));
                    const hasInstalls = Number.isFinite(Number(data.totalInstalls));

                    let regionText = "";

                    if (data.topRegion && typeof data.topRegion === "object") {{
                      const regionName = data.topRegion.name || "";
                      const regionCount = Number(data.topRegion.count);

                      if (regionName) {{
                        regionText = Number.isFinite(regionCount)
                          ? regionName + " · " + formatNumber(regionCount) + " 次"
                          : regionName;
                      }}
                    }} else if (typeof data.topRegion === "string") {{
                      regionText = data.topRegion;
                    }}

                    if (hasVisits) {{
                      statsVisits.textContent = formatNumber(data.totalVisits);
                    }}

                    if (hasInstalls) {{
                      statsInstalls.textContent = formatNumber(data.totalInstalls);
                    }}

                    if (regionText) {{
                      statsRegion.textContent = regionText;
                    }}

                    const domesticRegions = Array.isArray(data.domesticRegions)
                      ? data.domesticRegions.slice(0, 5)
                      : [];

                    if (domesticRegions.length) {{
                      regionChips.innerHTML = domesticRegions
                        .map(item => {{
                          const name = String(item.name || "");
                          const count = formatNumber(item.count);
                          return '<span class="region-chip">' +
                            name + " " + count +
                            "</span>";
                        }})
                        .join("");

                      regionSummary.hidden = false;
                    }}

                    const scriptInstalls =
                      data.scriptInstalls && typeof data.scriptInstalls === "object"
                        ? data.scriptInstalls
                        : {{}};

                    cards.forEach(card => {{
                      const scriptId = card.dataset.scriptId;
                      const count = Number(scriptInstalls[scriptId]);

                      if (!Number.isFinite(count)) {{
                        return;
                      }}

                      const target = card.querySelector(".install-count");
                      const strong = target?.querySelector("strong");

                      if (target && strong) {{
                        strong.textContent = formatNumber(count);
                        target.hidden = false;
                      }}
                    }});

                    const topScripts = Array.isArray(data.topScripts)
                      ? data.topScripts.slice(0, 5)
                      : [];

                    const domesticCities = Array.isArray(data.domesticCities)
                      ? data.domesticCities.slice(0, 5)
                      : [];

                    renderRanking(
                      topScriptsList,
                      topScripts,
                      item => scriptNameMap.get(item.scriptId) || item.scriptId || "未知脚本"
                    );

                    renderRanking(
                      topCitiesList,
                      domesticCities,
                      item => String(item.name || "未知城市")
                    );

                    trendData = Array.isArray(data.recent14Days)
                      ? data.recent14Days.slice(-14)
                      : [];

                    const hasDetailData =
                      topScripts.length ||
                      domesticCities.length ||
                      trendData.some(item =>
                        Number(item.visits) > 0 ||
                        Number(item.installs) > 0
                      );

                    if (hasDetailData) {{
                      statsDetails.hidden = false;
                      requestAnimationFrame(drawTrendChart);
                    }}

                    if (
                      hasVisits ||
                      hasInstalls ||
                      regionText ||
                      domesticRegions.length ||
                      hasDetailData
                    ) {{
                      statsSection.classList.remove("hidden");
                    }}
                  }} catch (_) {{
                    // 统计后端尚未启用时保持页面正常，不显示空统计区。
                  }}
                }}

                function refresh() {{
                  const query = search.value.trim().toLowerCase();
                  let visible = 0;

                  cards.forEach(card => {{
                    const groupMatch =
                      activeGroup === "all" ||
                      card.dataset.folder === activeGroup;

                    const textMatch =
                      !query ||
                      card.dataset.search.includes(query);

                    const show = groupMatch && textMatch;

                    card.classList.toggle("hidden", !show);

                    if (show) {{
                      visible += 1;
                    }}
                  }});

                  seriesGroups.forEach(group => {{
                    const hasVisibleCard = [...group.querySelectorAll(".script-card")]
                      .some(card => !card.classList.contains("hidden"));

                    group.classList.toggle("hidden", !hasVisibleCard);
                  }});

                  folderGroups.forEach(group => {{
                    const hasVisibleCard = [...group.querySelectorAll(".script-card")]
                      .some(card => !card.classList.contains("hidden"));

                    group.classList.toggle("hidden", !hasVisibleCard);
                  }});

                  empty.style.display = visible ? "none" : "block";
                }}

                filters.forEach(button => {{
                  button.addEventListener("click", () => {{
                    filters.forEach(item => item.classList.remove("active"));
                    button.classList.add("active");
                    activeGroup = button.dataset.group;
                    refresh();
                  }});
                }});

                search.addEventListener("input", refresh);

                installLinks.forEach(link => {{
                  link.addEventListener("click", () => {{
                    trackEvent(
                      "install_click",
                      link.dataset.scriptId || ""
                    );
                  }});
                }});

                let chartResizeTimer = null;

                window.addEventListener("resize", () => {{
                  clearTimeout(chartResizeTimer);
                  chartResizeTimer = setTimeout(drawTrendChart, 120);
                }});

                trackEvent("page_view");
                loadStats();
              }})();
            </script>
          </body>
          </html>
          """
          INDEX_PATH.write_text(
              html,
              encoding="utf-8",
              newline="\n",
          )

          print(f"README 已生成，共 {len(items)} 个脚本。")
          print(f"Cloudflare 首页已生成：{INDEX_PATH}")
          print(f"首页地址：{BASE_URL}")
          PY

      - name: Commit README And Homepage
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${README_FILE}" "${PUBLISH_DIR}/index.html"

          if git diff --cached --quiet; then
            echo "README 与首页无变化，无需提交。"
            exit 0
          fi

          git commit -m "[auto-readme] 自动更新 README 与脚本主页"
          git push origin "HEAD:${GITHUB_BRANCH}"

          echo "README 与 Cloudflare 脚本主页更新完成。"

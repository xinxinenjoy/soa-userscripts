            <section class="section" id="scripts">
              <div class="wrap">
                <div class="section-head">
                  <div>
                    <h2 class="section-title">脚本列表</h2>
                    <p class="section-desc">
                      可按分类筛选或直接搜索名称、说明和脚本 ID。
                      “立即安装”使用本站固定 Cloudflare 地址，后续自动更新地址保持一致。
                    </p>
                  </div>
                </div>
              </div>
            </section>

            <div class="toolbar">
              <div class="wrap toolbar-inner">
                <input
                  id="search"
                  class="search"
                  type="search"
                  placeholder="搜索脚本名称、说明或 ID..."
                  autocomplete="off"
                >
                <div class="filters">
                  {''.join(buttons)}
                </div>
              </div>
            </div>

            <main class="scripts-content">
              <div class="wrap">
                <section class="script-grid">
                  {''.join(cards)}
                </section>
                <div id="empty" class="empty">没有找到匹配的脚本。</div>
              </div>
            </main>

            <section class="wrap guide">
              <h2>使用与更新说明</h2>

              <details open>
                <summary>如何安装脚本</summary>
                <ol>
                  <li>先在上方安装与你浏览器对应的 Tampermonkey 正式版。</li>
                  <li>返回本页，在脚本列表中点击“立即安装”。</li>
                  <li>Tampermonkey 打开安装页面后，确认脚本名称并点击“安装”。</li>
                  <li>打开脚本对应的网站并刷新页面即可使用。</li>
                </ol>
              </details>

              <details>
                <summary>如何检查脚本更新</summary>
                <p>
                  打开 Tampermonkey 管理面板，点击“检查用户脚本更新”。
                  脚本会通过固定的 @updateURL 比较远程和本地 @version；
                  发现新版后通过 @downloadURL 获取更新。
                </p>
              </details>

              <details>
                <summary>新版刚发布但暂时没有检测到</summary>
                <p>
                  请先等待 GitHub Actions 与 Cloudflare Pages 部署完成。
                  如果希望立即更新，也可以重新点击对应脚本的“立即安装”按钮覆盖安装。
                </p>
              </details>
            </section>

            <footer class="footer">
              <div class="wrap">
                WanXin Userscripts · 页面与脚本清单由 GitHub Actions 自动维护
              </div>
            </footer>

            <script>
              (() => {{
                const search = document.getElementById("search");
                const cards = [...document.querySelectorAll(".script-card")];
                const filters = [...document.querySelectorAll(".filter")];
                const empty = document.getElementById("empty");
                const ua = navigator.userAgent;

                let activeGroup = "all";
                let browser = "";

                if (ua.includes("Edg/")) {{
                  browser = "edge";
                }} else if (ua.includes("Firefox/")) {{
                  browser = "firefox";
                }} else if (ua.includes("Chrome/") || ua.includes("Chromium/")) {{
                  browser = "chrome";
                }}

                if (browser) {{
                  const recommended = document.querySelector(
                    '.tm-card[data-browser="' + browser + '"]'
                  );

                  if (recommended) {{
                    recommended.classList.add("recommended");
                  }}
                }}

                function refresh() {{
                  const query = search.value.trim().toLowerCase();
                  let visible = 0;

                  cards.forEach(card => {{
                    const groupMatch =
                      activeGroup === "all" ||
                      card.dataset.group === activeGroup;

                    const textMatch =
                      !query ||
                      card.dataset.search.includes(query);

                    const show = groupMatch && textMatch;

                    card.classList.toggle("hidden", !show);

                    if (show) {{
                      visible += 1;
                    }}
                  }});

                  empty.style.display = visible ? "none" : "block";
                }}

                filters.forEach(button => {{
                  button.addEventListener("click", () => {{
                    filters.forEach(item => item.classList.remove("active"));
                    button.classList.add("active");
                    activeGroup = button.dataset.group;
                    refresh();
                  }});
                }});

                search.addEventListener("input", refresh);
              }})();
            </script>
          </body>
          </html>
          """
          INDEX_PATH.write_text(
              html,
              encoding="utf-8",
              newline="\n",
          )

          print(f"README 已生成，共 {len(items)} 个脚本。")
          print(f"Cloudflare 首页已生成：{INDEX_PATH}")
          print(f"首页地址：{BASE_URL}")
          PY

      - name: Commit README And Homepage
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${README_FILE}" "${PUBLISH_DIR}/index.html"

          if git diff --cached --quiet; then
            echo "README 与首页无变化，无需提交。"
            exit 0
          fi

          git commit -m "[auto-readme] 自动更新 README 与脚本主页"
          git push origin "HEAD:${GITHUB_BRANCH}"

          echo "README 与 Cloudflare 脚本主页更新完成。"

                  <div class="tm-note">
                    <span>
                      页面会根据当前浏览器自动标记推荐安装入口。
                      扩展仍需在浏览器官方商店页面确认安装，这是浏览器的安全要求。
                    </span>
                    <a href="{h(TAMPERMONKEY_OFFICIAL)}"
                       target="_blank"
                       rel="noopener noreferrer">

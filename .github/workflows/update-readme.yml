name: Update Userscripts README

env:
  GITHUB_BRANCH: main
  README_FILE: README.md
  PUBLISH_DIR: publish
  DISTRIBUTION_BASE_URL: https://scripts.wanxinxin.dpdns.org

on:
  workflow_run:
    workflows:
      - "Build Userscripts"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-userscripts-readme
  cancel-in-progress: true

jobs:
  update-readme:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          fetch-depth: 0

      - name: Generate README And Cloudflare Homepage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html import escape
          import os
          import re
          import subprocess
          import sys

          ROOT = Path(".")
          README_PATH = ROOT / os.environ.get("README_FILE", "README.md")
          PUBLISH_DIR = os.environ.get("PUBLISH_DIR", "publish")
          PUBLISH_ROOT = ROOT / PUBLISH_DIR
          INDEX_PATH = PUBLISH_ROOT / "index.html"

          BASE_URL = os.environ.get(
              "DISTRIBUTION_BASE_URL",
              "https://scripts.wanxinxin.dpdns.org"
          ).rstrip("/")

          GITHUB_REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
          GITHUB_REPO_URL = f"https://github.com/{GITHUB_REPOSITORY}"

          START_RE = re.compile(r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$")
          END_RE = re.compile(r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$")
          META_RE = re.compile(
              r"^[ \t]*//[ \t]*@([A-Za-z0-9:_-]+)(?:[ \t]+(.*?))?[ \t]*$"
          )

          TZ = ZoneInfo("Asia/Shanghai")


          def parse_meta(text, label):
              start = START_RE.search(text)
              end = END_RE.search(text)

              if not start or not end or end.start() <= start.end():
                  raise ValueError(f"{label}: 缺少完整 UserScript 元数据区")

              result = {}

              for line in text[start.start():end.end()].splitlines():
                  match = META_RE.match(line)
                  if not match:
                      continue

                  key = match.group(1)
                  value = (match.group(2) or "").strip()
                  result.setdefault(key, []).append(value)

              return result


          def first(meta, key, default=""):
              values = meta.get(key) or []
              return values[0] if values else default


          def md(value):
              return (
                  str(value or "")
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .strip()
              )


          def h(value):
              return escape(str(value or "").strip(), quote=True)


          def source_modified(relative):
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cI",
                          "--",
                          relative.as_posix(),
                      ],
                      cwd=ROOT,
                      text=True,
                      capture_output=True,
                      check=True,
                  )

                  raw = result.stdout.strip()

                  if not raw:
                      return "-", None

                  dt = datetime.fromisoformat(raw).astimezone(TZ)
                  return dt.strftime("%Y-%m-%d %H:%M"), dt

              except Exception as exc:
                  print(
                      "::warning::"
                      f"无法读取 {relative} 的最后修改时间：{exc}"
                  )
                  return "-", None


          # 1. 扫描源脚本，建立 publishID -> 原始分类 / 修改时间映射
          source_by_id = {}
          source_errors = []

          for path in sorted(ROOT.rglob("*.user.js")):
              relative = path.relative_to(ROOT)

              if relative.parts and relative.parts[0] == PUBLISH_DIR:
                  continue

              try:
                  meta = parse_meta(
                      path.read_text(encoding="utf-8-sig"),
                      str(relative),
                  )
              except Exception as exc:
                  source_errors.append(str(exc))
                  continue

              publish_id = first(meta, "publishID")

              if not publish_id:
                  continue

              key = publish_id.lower()

              if key in source_by_id:
                  source_errors.append(
                      f"源脚本 @publishID 重复：{publish_id}"
                  )
                  continue

              modified_at, modified_dt = source_modified(relative)

              source_by_id[key] = {
                  "relative": relative,
                  "group": (
                      relative.parts[0]
                      if len(relative.parts) > 1
                      else "根目录"
                  ),
                  "modified_at": modified_at,
                  "modified_dt": modified_dt,
              }

          if source_errors:
              print("读取源脚本时发现问题：")
              for error in source_errors:
                  print(f"  - {error}")
              sys.exit(1)


          # 2. 扫描 publish/ 正式发布脚本
          PUBLISH_ROOT.mkdir(parents=True, exist_ok=True)

          items = []
          errors = []

          for path in sorted(PUBLISH_ROOT.rglob("*.user.js")):
              relative_from_root = path.relative_to(ROOT)

              try:
                  meta = parse_meta(
                      path.read_text(encoding="utf-8-sig"),
                      str(relative_from_root),
                  )
              except Exception as exc:
                  errors.append(str(exc))
                  continue

              name = first(meta, "name", path.stem)
              version = first(meta, "version", "-")
              description = first(meta, "description", "")
              publish_group = first(meta, "publishGroup", "root")
              publish_id = first(
                  meta,
                  "publishID",
                  path.name[:-8] if path.name.endswith(".user.js") else path.stem,
              )

              source = source_by_id.get(publish_id.lower())

              if source:
                  display_group = source["group"]
                  modified_at = source["modified_at"]
                  modified_dt = source["modified_dt"]
                  source_relative = source["relative"]
              else:
                  display_group = publish_group
                  modified_at = "-"
                  modified_dt = None
                  source_relative = None

                  print(
                      "::warning::"
                      f"{publish_id} 未找到对应源脚本，分类回退为 {publish_group}"
                  )

              filename = f"{publish_id}.user.js"
              install_url = (
                  f"{BASE_URL}/"
                  f"{quote(publish_group, safe='._-')}/"
                  f"{quote(filename, safe='._-')}"
              )

              update_url = first(meta, "updateURL")
              download_url = first(meta, "downloadURL")

              if update_url != install_url:
                  errors.append(
                      f"{relative_from_root}: @updateURL 不正确："
                      f"{update_url or '[缺失]'}"
                  )
                  continue

              if download_url != install_url:
                  errors.append(
                      f"{relative_from_root}: @downloadURL 不正确："
                      f"{download_url or '[缺失]'}"
                  )
                  continue

              github_raw = (
                  f"https://raw.githubusercontent.com/"
                  f"{GITHUB_REPOSITORY}/{GITHUB_BRANCH}/"
                  + "/".join(
                      quote(part, safe="._-")
                      for part in relative_from_root.parts
                  )
              )

              if source_relative:
                  github_source = (
                      f"{GITHUB_REPO_URL}/blob/{GITHUB_BRANCH}/"
                      + "/".join(
                          quote(part, safe="._-")
                          for part in source_relative.parts
                      )
                  )
              else:
                  github_source = GITHUB_REPO_URL

              items.append({
                  "name": name,
                  "version": version,
                  "description": description,
                  "display_group": display_group,
                  "publish_group": publish_group,
                  "publish_id": publish_id,
                  "modified_at": modified_at,
                  "modified_dt": modified_dt,
                  "install_url": install_url,
                  "github_raw": github_raw,
                  "github_source": github_source,
              })

          if errors:
              print("生成 README / 首页前发现以下问题：")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)


          # 3. 分类
          groups = {}

          for item in items:
              groups.setdefault(item["display_group"], []).append(item)

          latest = max(
              (item for item in items if item["modified_dt"] is not None),
              key=lambda x: x["modified_dt"],
              default=None,
          )

          latest_text = latest["modified_at"] if latest else "-"


          # 4. README
          lines = [
              '<div align="center">',
              '',
              '# 🧰 WanXin Userscripts',
              '',
              '**个人维护的 Tampermonkey 用户脚本集合**',
              '',
              f'🌐 **脚本主页：[{BASE_URL}]({BASE_URL})**',
              '',
              'GitHub 作为唯一开发源，Cloudflare Pages 提供展示、安装与自动更新。',
              '',
              f'当前正式发布 **{len(items)}** 个脚本 · 最近修改 **{latest_text}**',
              '',
              '</div>',
              '',
              '---',
              '',
              '## 🚀 快速开始',
              '',
              '### 1. 安装 Tampermonkey',
              '',
              '| 浏览器 | 安装入口 |',
              '|---|---|',
              '| Chrome | [Chrome Web Store](https://chromewebstore.google.com/detail/tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo) |',
              '| Edge | [Microsoft Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/tampermonkey/iikmkjmpaadaobahmlepeloendndfphd) |',
              '| Firefox | [Firefox Add-ons](https://addons.mozilla.org/zh-CN/firefox/addon/tampermonkey/) |',
              '| 官方网站 | [Tampermonkey](https://www.tampermonkey.net/) |',
              '',
              '### 2. 安装脚本',
              '',
              '推荐进入上方 **脚本主页**，找到需要的脚本后点击 **立即安装**。',
              '',
              f'> 安装和自动更新统一使用 `{BASE_URL}`，GitHub Raw 仅作为备用。',
              '',
              '### 3. 检查更新',
              '',
              '打开 **Tampermonkey → 管理面板 → 检查用户脚本更新**。',
              '',
              '脚本通过元数据中的 `@version` 判断新版，并通过固定的 `@updateURL` / `@downloadURL` 自动更新。',
              '',
              '---',
              '',
              '## 📦 脚本列表',
              '',
          ]

          if not items:
              lines.extend([
                  '> 暂无正式发布脚本。',
                  '',
              ])

          else:
              for group in sorted(groups, key=str.lower):
                  group_items = sorted(
                      groups[group],
                      key=lambda x: (
                          x["name"].lower(),
                          x["publish_id"].lower(),
                      ),
                  )

                  lines.extend([
                      f'### {md(group)} · {len(group_items)} 个',
                      '',
                      '| 脚本 | 版本 | 修改时间 | 功能说明 | 安装 |',
                      '|---|---:|---|---|---|',
                  ])

                  for item in group_items:
                      lines.append(
                          '| '
                          + f"**{md(item['name'])}** | "
                          + f"`{md(item['version'])}` | "
                          + f"{md(item['modified_at'])} | "
                          + f"{md(item['description']) or '-'} | "
                          + f"[⚡ 推荐安装]({item['install_url']})"
                          + f" · [GitHub 备用]({item['github_raw']}) |"
                      )

                  lines.append('')

          lines.extend([
              '---',
              '',
              '## 🧩 Tampermonkey 使用说明',
              '',
              '<details>',
              '<summary><strong>如何安装脚本</strong></summary>',
              '',
              '1. 安装 Tampermonkey。',
              '2. 打开脚本主页。',
              '3. 点击对应脚本的 **立即安装**。',
              '4. 在 Tampermonkey 安装页面确认后点击 **安装**。',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>如何手动检查更新</strong></summary>',
              '',
              '打开 Tampermonkey 管理面板，点击 **检查用户脚本更新**。',
              '',
              'Tampermonkey 会读取 `@updateURL`，比较远程与本地 `@version`；远程版本更高时，通过 `@downloadURL` 获取新版。',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>新版刚发布但暂时没有检测到</strong></summary>',
              '',
              '请先等待 GitHub Actions 与 Cloudflare Pages 部署完成，再重新检查。',
              '',
              '如果需要立即更新，也可以重新点击脚本主页中的 **立即安装** 覆盖更新。',
              '',
              '</details>',
              '',
              '---',
              '',
              '## 🔄 发布架构',
              '',
              '```text',
              '本地修改',
              '   ↓',
              'GitHub main',
              '   ↓',
              'Build Userscripts',
              '   ↓',
              'publish/',
              '   ↓',
              'Update Userscripts README',
              '   ├─ README.md',
              '   └─ publish/index.html',
              '          ↓',
              'Cloudflare Pages',
              '   ├─ 展示主页',
              '   ├─ 脚本安装',
              '   └─ Tampermonkey 自动更新',
              '',
              '同时：README + publish/ → GitCode 备用镜像',
              '```',
              '',
              '---',
              '',
              '<div align="center">',
              '',
              'README 与脚本主页由 GitHub Actions 自动维护。',
              '',
              '</div>',
              '',
          ])

          README_PATH.write_text(
              "\n".join(lines),
              encoding="utf-8",
              newline="\n",
          )


          # 5. Cloudflare Pages 首页
          TAMPERMONKEY_OFFICIAL = "https://www.tampermonkey.net/?locale=zh"
          TAMPERMONKEY_CHROME = (
              "https://chromewebstore.google.com/detail/"
              "tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo"
          )
          TAMPERMONKEY_EDGE = (
              "https://microsoftedge.microsoft.com/addons/detail/"
              "tampermonkey/iikmkjmpaadaobahmlepeloendndfphd"
          )
          TAMPERMONKEY_FIREFOX = (
              "https://addons.mozilla.org/zh-CN/firefox/addon/tampermonkey/"
          )

          buttons = [
              '<button class="filter active" data-group="all">全部</button>'
          ]

          for group in sorted(groups, key=str.lower):
              buttons.append(
                  f'<button class="filter" data-group="{h(group)}">{h(group)}</button>'
              )

          cards = []

          for group in sorted(groups, key=str.lower):
              for item in sorted(
                  groups[group],
                  key=lambda x: (
                      x["name"].lower(),
                      x["publish_id"].lower(),
                  ),
              ):
                  search_text = " ".join([
                      item["name"],
                      item["description"],
                      item["display_group"],
                      item["publish_id"],
                  ]).lower()

                  cards.append(
                      f"""
                      <article class="script-card"
                               data-group="{h(item["display_group"])}"
                               data-search="{h(search_text)}">
                        <div class="script-card-head">
                          <div class="script-title-wrap">
                            <span class="script-category">{h(item["display_group"])}</span>
                            <h3>{h(item["name"])}</h3>
                          </div>
                          <span class="script-version">v{h(item["version"])}</span>
                        </div>

                        <p class="script-description">
                          {h(item["description"]) or "暂无功能说明"}
                        </p>

                        <div class="script-meta">
                          <span>更新：{h(item["modified_at"])}</span>
                          <span>ID：{h(item["publish_id"])}</span>
                        </div>

                        <div class="script-actions">
                          <a class="button button-primary"
                             href="{h(item["install_url"])}">
                            立即安装
                          </a>
                          <a class="button button-secondary"
                             href="{h(item["github_source"])}"
                             target="_blank"
                             rel="noopener noreferrer">
                            查看源码
                          </a>
                        </div>
                      </article>
                      """
                  )

          html = f"""<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description"
                  content="WanXin Userscripts：Tampermonkey 用户脚本安装、更新与使用主页">
            <meta name="color-scheme" content="light">
            <title>WanXin Userscripts</title>

            <style>
              :root {{
                --page: #f5f6f8;
                --panel: #ffffff;
                --panel-soft: #fafafa;
                --text: #20242d;
                --muted: #727986;
                --line: #e4e7ec;
                --accent: #e5484d;
                --accent-dark: #cf393f;
                --accent-soft: #fff0f0;
                --green: #37a856;
                --green-dark: #2f934b;
                --shadow: 0 14px 38px rgba(23, 28, 38, .08);
                --radius-xl: 26px;
                --radius-lg: 18px;
                --radius-md: 13px;
              }}

              * {{
                box-sizing: border-box;
              }}

              html {{
                scroll-behavior: smooth;
              }}

              body {{
                margin: 0;
                color: var(--text);
                background:
                  radial-gradient(circle at 15% -10%, #ffffff 0, transparent 34rem),
                  var(--page);
                font-family:
                  "PingFang SC",
                  "Microsoft YaHei",
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }}

              a {{
                color: inherit;
                text-decoration: none;
              }}

              button,
              input {{
                font: inherit;
              }}

              .wrap {{
                width: min(1180px, calc(100% - 32px));
                margin: 0 auto;
              }}

              .hero {{
                padding: 42px 0 20px;
              }}

              .hero-panel {{
                overflow: hidden;
                position: relative;
                padding: 42px;
                border: 1px solid rgba(229, 72, 77, .10);
                border-radius: var(--radius-xl);
                background:
                  linear-gradient(135deg, #ffffff 0%, #fff7f7 100%);
                box-shadow: var(--shadow);
              }}

              .hero-panel::after {{
                content: "";
                position: absolute;
                right: -80px;
                top: -120px;
                width: 310px;
                height: 310px;
                border-radius: 50%;
                background: rgba(229, 72, 77, .055);
                pointer-events: none;
              }}

              .brand-row {{
                display: flex;
                align-items: center;
                gap: 15px;
              }}

              .brand-mark {{
                display: grid;
                width: 52px;
                height: 52px;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                align-items: center;
                padding: 7px;
                border-radius: 15px;
                background: #222;
                box-shadow: 0 8px 18px rgba(0,0,0,.14);
              }}

              .brand-mark span {{
                display: block;
                width: 100%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #f2f2f2;
              }}

              .eyebrow {{
                margin: 0 0 4px;
                color: var(--accent);
                font-size: 13px;
                font-weight: 800;
                letter-spacing: .04em;
                text-transform: uppercase;
              }}

              h1 {{
                margin: 0;
                font-size: clamp(32px, 6vw, 54px);
                line-height: 1.08;
                letter-spacing: -1.2px;
              }}

              .hero-copy {{
                position: relative;
                z-index: 1;
                max-width: 820px;
                margin: 20px 0 0;
                color: var(--muted);
                font-size: 16px;
                line-height: 1.85;
              }}

              .hero-actions {{
                position: relative;
                z-index: 1;
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 24px;
              }}

              .button {{
                display: inline-flex;
                min-height: 42px;
                align-items: center;
                justify-content: center;
                padding: 0 16px;
                border: 1px solid transparent;
                border-radius: 12px;
                cursor: pointer;
                font-size: 14px;
                font-weight: 750;
                transition:
                  transform .15s ease,
                  background .15s ease,
                  border-color .15s ease;
              }}

              .button:hover {{
                transform: translateY(-1px);
              }}

              .button-primary {{
                color: #fff;
                background: var(--accent);
              }}

              .button-primary:hover {{
                background: var(--accent-dark);
              }}

              .button-secondary {{
                border-color: var(--line);
                background: #fff;
              }}

              .button-secondary:hover {{
                border-color: #d4d7de;
                background: #fafafa;
              }}

              .hero-stats {{
                position: relative;
                z-index: 1;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 25px;
              }}

              .stat-pill {{
                padding: 8px 11px;
                border: 1px solid rgba(229, 72, 77, .10);
                border-radius: 999px;
                color: #6f5960;
                background: rgba(255,255,255,.75);
                font-size: 13px;
              }}

              .stat-pill strong {{
                color: var(--text);
              }}

              .section {{
                padding: 18px 0;
              }}

              .section-head {{
                display: flex;
                gap: 18px;
                align-items: flex-end;
                justify-content: space-between;
                margin-bottom: 16px;
              }}

              .section-title {{
                margin: 0;
                font-size: 25px;
                line-height: 1.3;
              }}

              .section-desc {{
                max-width: 720px;
                margin: 6px 0 0;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.7;
              }}

              .steps {{
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 12px;
                margin-top: 16px;
              }}

              .step {{
                display: flex;
                gap: 12px;
                align-items: flex-start;
                padding: 17px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: #fff;
              }}

              .step-number {{
                display: grid;
                flex: 0 0 auto;
                width: 30px;
                height: 30px;
                place-items: center;
                border-radius: 50%;
                color: #fff;
                background: var(--accent);
                font-size: 13px;
                font-weight: 800;
              }}

              .step strong {{
                display: block;
                margin-bottom: 4px;
                font-size: 14px;
              }}

              .step p {{
                margin: 0;
                color: var(--muted);
                font-size: 13px;
                line-height: 1.55;
              }}

              .tm-panel {{
                padding: 22px;
                border: 1px solid var(--line);
                border-radius: var(--radius-xl);
                background: #fff;
                box-shadow: 0 8px 24px rgba(23, 28, 38, .045);
              }}

              .tm-grid {{
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 14px;
              }}

              .tm-card {{
                position: relative;
                display: flex;
                min-height: 178px;
                flex-direction: column;
                padding: 20px;
                border: 1px solid var(--line);
                border-radius: var(--radius-lg);
                background: var(--panel-soft);
                transition:
                  transform .16s ease,
                  box-shadow .16s ease,
                  border-color .16s ease;
              }}

              .tm-card:hover {{
                transform: translateY(-2px);
                border-color: #d7dbe2;
                box-shadow: 0 12px 28px rgba(23, 28, 38, .07);
              }}

              .tm-card.recommended {{
                border-color: rgba(55, 168, 86, .55);
                box-shadow: 0 0 0 3px rgba(55, 168, 86, .07);
              }}

              .tm-card.recommended::after {{
                content: "当前浏览器推荐";
                position: absolute;
                right: 14px;
                top: 14px;
                padding: 5px 8px;
                border-radius: 999px;
                color: #267f40;
                background: #eaf8ee;
                font-size: 11px;
                font-weight: 800;
              }}

              .tm-card-top {{
                display: flex;
                gap: 12px;
                align-items: center;
                padding-right: 78px;
              }}

              .tm-logo {{
                display: grid;
                flex: 0 0 auto;
                width: 46px;
                height: 46px;
                grid-template-columns: repeat(2, 1fr);
                gap: 4px;
                align-items: center;
                padding: 6px;
                border-radius: 12px;
                background: #232323;
              }}

              .tm-logo span {{
                display: block;
                width: 100%;
                aspect-ratio: 1;
                border-radius: 50%;
                background: #f3f3f3;
              }}

              .tm-name {{
                margin: 0;
                font-size: 17px;
                line-height: 1.25;
              }}

              .tm-browser {{
                margin-top: 3px;
                color: var(--muted);
                font-size: 12px;
              }}

              .tm-meta {{
                margin: 14px 0 16px;
                color: var(--muted);
                font-size: 13px;
              }}

              .store-button {{
                display: inline-flex;
                width: 100%;
                min-height: 42px;
                align-items: center;
                justify-content: center;
                margin-top: auto;
                border-radius: 11px;
                color: #fff;
                background: var(--green);
                font-size: 14px;
                font-weight: 800;
              }}

              .store-button:hover {{
                background: var(--green-dark);
              }}

              .tm-note {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px 14px;
                align-items: center;
                justify-content: space-between;
                margin-top: 14px;
                padding: 13px 15px;
                border-radius: 12px;
                color: var(--muted);
                background: #f7f8fa;
                font-size: 13px;
                line-height: 1.6;
              }}

              .tm-note a {{
                color: var(--accent);
                font-weight: 700;
              }}

              .toolbar {{
                position: sticky;
                top: 0;
                z-index: 20;
                padding: 12px 0;
                background: rgba(245, 246, 248, .91);
                backdrop-filter: blur(15px);
              }}

              .toolbar-inner {{
                display: flex;
                gap: 12px;
                align-items: center;
              }}

              .search {{
                flex: 1;
                min-width: 260px;
                height: 46px;
                padding: 0 16px;
                border: 1px solid var(--line);
                border-radius: 14px;
                outline: none;
                background: #fff;
                font-size: 15px;

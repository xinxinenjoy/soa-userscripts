name: Update Userscripts README

env:
  GITHUB_BRANCH: main
  README_FILE: README.md
  PUBLISH_DIR: publish
  DISTRIBUTION_BASE_URL: https://scripts.wanxinxin.dpdns.org

on:
  workflow_run:
    workflows:
      - "Build Userscripts"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-userscripts-readme
  cancel-in-progress: true

jobs:
  update-readme:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Latest Main
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          fetch-depth: 0

      - name: Generate README And Cloudflare Homepage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from html import escape
          import os
          import re
          import subprocess
          import sys

          ROOT = Path(".")
          README_PATH = ROOT / os.environ.get("README_FILE", "README.md")
          PUBLISH_DIR = os.environ.get("PUBLISH_DIR", "publish")
          PUBLISH_ROOT = ROOT / PUBLISH_DIR
          INDEX_PATH = PUBLISH_ROOT / "index.html"

          BASE_URL = os.environ.get(
              "DISTRIBUTION_BASE_URL",
              "https://scripts.wanxinxin.dpdns.org"
          ).rstrip("/")

          GITHUB_REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
          GITHUB_REPO_URL = f"https://github.com/{GITHUB_REPOSITORY}"

          START_RE = re.compile(r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$")
          END_RE = re.compile(r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$")
          META_RE = re.compile(
              r"^[ \t]*//[ \t]*@([A-Za-z0-9:_-]+)(?:[ \t]+(.*?))?[ \t]*$"
          )

          TZ = ZoneInfo("Asia/Shanghai")


          def parse_meta(text, label):
              start = START_RE.search(text)
              end = END_RE.search(text)

              if not start or not end or end.start() <= start.end():
                  raise ValueError(f"{label}: 缺少完整 UserScript 元数据区")

              result = {}

              for line in text[start.start():end.end()].splitlines():
                  match = META_RE.match(line)
                  if not match:
                      continue

                  key = match.group(1)
                  value = (match.group(2) or "").strip()
                  result.setdefault(key, []).append(value)

              return result


          def first(meta, key, default=""):
              values = meta.get(key) or []
              return values[0] if values else default


          def md(value):
              return (
                  str(value or "")
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .strip()
              )


          def h(value):
              return escape(str(value or "").strip(), quote=True)


          def source_modified(relative):
              try:
                  result = subprocess.run(
                      [
                          "git",
                          "log",
                          "-1",
                          "--format=%cI",
                          "--",
                          relative.as_posix(),
                      ],
                      cwd=ROOT,
                      text=True,
                      capture_output=True,
                      check=True,
                  )

                  raw = result.stdout.strip()

                  if not raw:
                      return "-", None

                  dt = datetime.fromisoformat(raw).astimezone(TZ)
                  return dt.strftime("%Y-%m-%d %H:%M"), dt

              except Exception as exc:
                  print(
                      "::warning::"
                      f"无法读取 {relative} 的最后修改时间：{exc}"
                  )
                  return "-", None


          # 1. 扫描源脚本，建立 publishID -> 原始分类 / 修改时间映射
          source_by_id = {}
          source_errors = []

          for path in sorted(ROOT.rglob("*.user.js")):
              relative = path.relative_to(ROOT)

              if relative.parts and relative.parts[0] == PUBLISH_DIR:
                  continue

              try:
                  meta = parse_meta(
                      path.read_text(encoding="utf-8-sig"),
                      str(relative),
                  )
              except Exception as exc:
                  source_errors.append(str(exc))
                  continue

              publish_id = first(meta, "publishID")

              if not publish_id:
                  continue

              key = publish_id.lower()

              if key in source_by_id:
                  source_errors.append(
                      f"源脚本 @publishID 重复：{publish_id}"
                  )
                  continue

              modified_at, modified_dt = source_modified(relative)

              source_by_id[key] = {
                  "relative": relative,
                  "group": (
                      relative.parts[0]
                      if len(relative.parts) > 1
                      else "根目录"
                  ),
                  "modified_at": modified_at,
                  "modified_dt": modified_dt,
              }

          if source_errors:
              print("读取源脚本时发现问题：")
              for error in source_errors:
                  print(f"  - {error}")
              sys.exit(1)


          # 2. 扫描 publish/ 正式发布脚本
          PUBLISH_ROOT.mkdir(parents=True, exist_ok=True)

          items = []
          errors = []

          for path in sorted(PUBLISH_ROOT.rglob("*.user.js")):
              relative_from_root = path.relative_to(ROOT)

              try:
                  meta = parse_meta(
                      path.read_text(encoding="utf-8-sig"),
                      str(relative_from_root),
                  )
              except Exception as exc:
                  errors.append(str(exc))
                  continue

              name = first(meta, "name", path.stem)
              version = first(meta, "version", "-")
              description = first(meta, "description", "")
              publish_group = first(meta, "publishGroup", "root")
              publish_id = first(
                  meta,
                  "publishID",
                  path.name[:-8] if path.name.endswith(".user.js") else path.stem,
              )

              source = source_by_id.get(publish_id.lower())

              if source:
                  display_group = source["group"]
                  modified_at = source["modified_at"]
                  modified_dt = source["modified_dt"]
                  source_relative = source["relative"]
              else:
                  display_group = publish_group
                  modified_at = "-"
                  modified_dt = None
                  source_relative = None

                  print(
                      "::warning::"
                      f"{publish_id} 未找到对应源脚本，分类回退为 {publish_group}"
                  )

              filename = f"{publish_id}.user.js"
              install_url = (
                  f"{BASE_URL}/"
                  f"{quote(publish_group, safe='._-')}/"
                  f"{quote(filename, safe='._-')}"
              )

              update_url = first(meta, "updateURL")
              download_url = first(meta, "downloadURL")

              if update_url != install_url:
                  errors.append(
                      f"{relative_from_root}: @updateURL 不正确："
                      f"{update_url or '[缺失]'}"
                  )
                  continue

              if download_url != install_url:
                  errors.append(
                      f"{relative_from_root}: @downloadURL 不正确："
                      f"{download_url or '[缺失]'}"
                  )
                  continue

              github_raw = (
                  f"https://raw.githubusercontent.com/"
                  f"{GITHUB_REPOSITORY}/{GITHUB_BRANCH}/"
                  + "/".join(
                      quote(part, safe="._-")
                      for part in relative_from_root.parts
                  )
              )

              if source_relative:
                  github_source = (
                      f"{GITHUB_REPO_URL}/blob/{GITHUB_BRANCH}/"
                      + "/".join(
                          quote(part, safe="._-")
                          for part in source_relative.parts
                      )
                  )
              else:
                  github_source = GITHUB_REPO_URL

              items.append({
                  "name": name,
                  "version": version,
                  "description": description,
                  "display_group": display_group,
                  "publish_group": publish_group,
                  "publish_id": publish_id,
                  "modified_at": modified_at,
                  "modified_dt": modified_dt,
                  "install_url": install_url,
                  "github_raw": github_raw,
                  "github_source": github_source,
              })

          if errors:
              print("生成 README / 首页前发现以下问题：")
              for error in errors:
                  print(f"  - {error}")
              sys.exit(1)


          # 3. 分类
          groups = {}

          for item in items:
              groups.setdefault(item["display_group"], []).append(item)

          latest = max(
              (item for item in items if item["modified_dt"] is not None),
              key=lambda x: x["modified_dt"],
              default=None,
          )

          latest_text = latest["modified_at"] if latest else "-"


          # 4. README
          lines = [
              '<div align="center">',
              '',
              '# 🧰 WanXin Userscripts',
              '',
              '**个人维护的 Tampermonkey 用户脚本集合**',
              '',
              f'🌐 **脚本主页：[{BASE_URL}]({BASE_URL})**',
              '',
              'GitHub 作为唯一开发源，Cloudflare Pages 提供展示、安装与自动更新。',
              '',
              f'当前正式发布 **{len(items)}** 个脚本 · 最近修改 **{latest_text}**',
              '',
              '</div>',
              '',
              '---',
              '',
              '## 🚀 快速开始',
              '',
              '### 1. 安装 Tampermonkey',
              '',
              '| 浏览器 | 安装入口 |',
              '|---|---|',
              '| Chrome | [Chrome Web Store](https://chromewebstore.google.com/detail/tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo) |',
              '| Edge | [Microsoft Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/tampermonkey/iikmkjmpaadaobahmlepeloendndfphd) |',
              '| Firefox | [Firefox Add-ons](https://addons.mozilla.org/zh-CN/firefox/addon/tampermonkey/) |',
              '| 官方网站 | [Tampermonkey](https://www.tampermonkey.net/) |',
              '',
              '### 2. 安装脚本',
              '',
              '推荐进入上方 **脚本主页**，找到需要的脚本后点击 **立即安装**。',
              '',
              f'> 安装和自动更新统一使用 `{BASE_URL}`，GitHub Raw 仅作为备用。',
              '',
              '### 3. 检查更新',
              '',
              '打开 **Tampermonkey → 管理面板 → 检查用户脚本更新**。',
              '',
              '脚本通过元数据中的 `@version` 判断新版，并通过固定的 `@updateURL` / `@downloadURL` 自动更新。',
              '',
              '---',
              '',
              '## 📦 脚本列表',
              '',
          ]

          if not items:
              lines.extend([
                  '> 暂无正式发布脚本。',
                  '',
              ])

          else:
              for group in sorted(groups, key=str.lower):
                  group_items = sorted(
                      groups[group],
                      key=lambda x: (
                          x["name"].lower(),
                          x["publish_id"].lower(),
                      ),
                  )

                  lines.extend([
                      f'### {md(group)} · {len(group_items)} 个',
                      '',
                      '| 脚本 | 版本 | 修改时间 | 功能说明 | 安装 |',
                      '|---|---:|---|---|---|',
                  ])

                  for item in group_items:
                      lines.append(
                          '| '
                          + f"**{md(item['name'])}** | "
                          + f"`{md(item['version'])}` | "
                          + f"{md(item['modified_at'])} | "
                          + f"{md(item['description']) or '-'} | "
                          + f"[⚡ 推荐安装]({item['install_url']})"
                          + f" · [GitHub 备用]({item['github_raw']}) |"
                      )

                  lines.append('')

          lines.extend([
              '---',
              '',
              '## 🧩 Tampermonkey 使用说明',
              '',
              '<details>',
              '<summary><strong>如何安装脚本</strong></summary>',
              '',
              '1. 安装 Tampermonkey。',
              '2. 打开脚本主页。',
              '3. 点击对应脚本的 **立即安装**。',
              '4. 在 Tampermonkey 安装页面确认后点击 **安装**。',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>如何手动检查更新</strong></summary>',
              '',
              '打开 Tampermonkey 管理面板，点击 **检查用户脚本更新**。',
              '',
              'Tampermonkey 会读取 `@updateURL`，比较远程与本地 `@version`；远程版本更高时，通过 `@downloadURL` 获取新版。',
              '',
              '</details>',
              '',
              '<details>',
              '<summary><strong>新版刚发布但暂时没有检测到</strong></summary>',
              '',
              '请先等待 GitHub Actions 与 Cloudflare Pages 部署完成，再重新检查。',
              '',
              '如果需要立即更新，也可以重新点击脚本主页中的 **立即安装** 覆盖更新。',
              '',
              '</details>',
              '',
              '---',
              '',
              '## 🔄 发布架构',
              '',
              '```text',
              '本地修改',
              '   ↓',
              'GitHub main',
              '   ↓',
              'Build Userscripts',
              '   ↓',
              'publish/',
              '   ↓',
              'Update Userscripts README',
              '   ├─ README.md',
              '   └─ publish/index.html',
              '          ↓',
              'Cloudflare Pages',
              '   ├─ 展示主页',
              '   ├─ 脚本安装',
              '   └─ Tampermonkey 自动更新',
              '',
              '同时：README + publish/ → GitCode 备用镜像',
              '```',
              '',
              '---',
              '',
              '<div align="center">',
              '',
              'README 与脚本主页由 GitHub Actions 自动维护。',
              '',
              '</div>',
              '',
          ])

          README_PATH.write_text(
              "\n".join(lines),
              encoding="utf-8",
              newline="\n",
          )


          # 5. Cloudflare Pages 首页
          buttons = [
              '<button class="filter active" data-group="all">全部</button>'
          ]

          for group in sorted(groups, key=str.lower):
              buttons.append(
                  f'<button class="filter" data-group="{h(group)}">{h(group)}</button>'
              )

          cards = []

          for group in sorted(groups, key=str.lower):
              for item in sorted(
                  groups[group],
                  key=lambda x: (
                      x["name"].lower(),
                      x["publish_id"].lower(),
                  ),
              ):
                  search_text = " ".join([
                      item["name"],
                      item["description"],
                      item["display_group"],
                      item["publish_id"],
                  ]).lower()

                  cards.append(
                      f'''
                      <article class="card"
                               data-group="{h(item["display_group"])}"
                               data-search="{h(search_text)}">
                        <div class="card-top">
                          <div>
                            <span class="category">{h(item["display_group"])}</span>
                            <h3>{h(item["name"])}</h3>
                          </div>
                          <span class="version">v{h(item["version"])}</span>
                        </div>

                        <p class="description">
                          {h(item["description"]) or "暂无功能说明"}
                        </p>

                        <div class="meta">
                          <span>修改：{h(item["modified_at"])}</span>
                          <span>ID：{h(item["publish_id"])}</span>
                        </div>

                        <div class="actions">
                          <a class="install" href="{h(item["install_url"])}">立即安装</a>
                          <a class="secondary"
                             href="{h(item["github_source"])}"
                             target="_blank"
                             rel="noopener noreferrer">查看源码</a>
                        </div>
                      </article>
                      '''
                  )

          html = f'''<!doctype html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="description" content="WanXin Tampermonkey 用户脚本发布主页">
            <title>WanXin Userscripts</title>

            <style>
              :root {{
                --bg: #f6f7fa;
                --panel: #ffffff;
                --text: #202532;
                --muted: #737b8c;
                --line: #e8eaf0;
                --accent: #e5484d;
                --accent-hover: #d53d42;
                --soft: #fff0f0;
                --shadow: 0 12px 34px rgba(25, 31, 45, .08);
                --radius: 18px;
              }}

              * {{ box-sizing: border-box; }}

              body {{
                margin: 0;
                color: var(--text);
                background: var(--bg);
                font-family:
                  "PingFang SC",
                  "Microsoft YaHei",
                  system-ui,
                  -apple-system,
                  "Segoe UI",
                  sans-serif;
              }}

              a {{
                color: inherit;
                text-decoration: none;
              }}

              .wrap {{
                width: min(1160px, calc(100% - 32px));
                margin: 0 auto;
              }}

              .hero {{
                padding: 48px 0 26px;
              }}

              .hero-box {{
                padding: 36px;
                border: 1px solid #f0e6e6;
                border-radius: 26px;
                background:
                  linear-gradient(135deg, #fff 0%, #fff7f7 100%);
                box-shadow: var(--shadow);
              }}

              .eyebrow {{
                display: inline-block;
                padding: 6px 10px;
                border-radius: 999px;
                color: var(--accent);
                background: var(--soft);
                font-size: 13px;
                font-weight: 700;
              }}

              h1 {{
                margin: 14px 0 0;
                font-size: clamp(34px, 6vw, 54px);
                line-height: 1.08;
              }}

              .subtitle {{
                max-width: 760px;
                margin: 16px 0 0;
                color: var(--muted);
                line-height: 1.8;
              }}

              .stats {{
                display: flex;
                flex-wrap: wrap;
                gap: 18px;
                margin-top: 24px;
                color: var(--muted);
                font-size: 14px;
              }}

              .stats strong {{
                color: var(--text);
              }}

              .toolbar {{
                position: sticky;
                top: 0;
                z-index: 10;
                padding: 12px 0;
                background: rgba(246, 247, 250, .9);
                backdrop-filter: blur(14px);
              }}

              .toolbar-inner {{
                display: flex;
                gap: 12px;
                align-items: center;
              }}

              .search {{
                flex: 1;
                min-width: 240px;
                height: 46px;
                padding: 0 16px;
                border: 1px solid var(--line);
                border-radius: 14px;
                outline: none;
                background: #fff;
                font-size: 15px;
              }}

              .search:focus {{
                border-color: #ee9da0;
                box-shadow: 0 0 0 4px rgba(229, 72, 77, .08);
              }}

              .filters {{
                display: flex;
                gap: 8px;
                overflow-x: auto;
              }}

              .filter {{
                padding: 10px 14px;
                border: 1px solid var(--line);
                border-radius: 999px;
                color: var(--muted);
                background: #fff;
                cursor: pointer;
                white-space: nowrap;
                font: inherit;
              }}

              .filter.active {{
                color: #fff;
                border-color: var(--accent);
                background: var(--accent);
              }}

              .content {{
                padding: 16px 0 50px;
              }}

              .grid {{
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 18px;
              }}

              .card {{
                display: flex;
                min-height: 250px;
                flex-direction: column;
                padding: 24px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: var(--panel);
                box-shadow: 0 8px 22px rgba(25, 31, 45, .04);
                transition: .18s ease;
              }}

              .card:hover {{
                transform: translateY(-2px);
                box-shadow: var(--shadow);
              }}

              .card.hidden {{
                display: none;
              }}

              .card-top {{
                display: flex;
                justify-content: space-between;
                gap: 16px;
                align-items: flex-start;
              }}

              .category {{
                color: var(--accent);
                font-size: 12px;
                font-weight: 700;
              }}

              h3 {{
                margin: 7px 0 0;
                font-size: 20px;
                line-height: 1.45;
              }}

              .version {{
                flex: 0 0 auto;
                padding: 6px 10px;
                border-radius: 999px;
                color: var(--accent);
                background: var(--soft);
                font-size: 12px;
                font-weight: 700;
              }}

              .description {{
                margin: 15px 0 0;
                color: var(--muted);
                line-height: 1.75;
              }}

              .meta {{
                display: flex;
                flex-wrap: wrap;
                gap: 8px 16px;
                margin-top: auto;
                padding-top: 18px;
                color: #969dab;
                font-size: 12px;
              }}

              .actions {{
                display: flex;
                gap: 10px;
                margin-top: 18px;
              }}

              .actions a {{
                display: inline-flex;
                min-height: 42px;
                align-items: center;
                justify-content: center;
                padding: 0 16px;
                border-radius: 12px;
                font-size: 14px;
                font-weight: 700;
              }}

              .install {{
                color: #fff;
                background: var(--accent);
              }}

              .install:hover {{
                background: var(--accent-hover);
              }}

              .secondary {{
                border: 1px solid var(--line);
                background: #fff;
              }}

              .guide {{
                margin-bottom: 60px;
                padding: 28px;
                border: 1px solid var(--line);
                border-radius: var(--radius);
                background: #fff;
              }}

              .guide h2 {{
                margin: 0 0 12px;
              }}

              details {{
                padding: 14px 0;
                border-top: 1px solid var(--line);
              }}

              details:first-of-type {{
                border-top: 0;
              }}

              summary {{
                cursor: pointer;
                font-weight: 700;
              }}

              details p,
              details ol {{
                color: var(--muted);
                line-height: 1.8;
              }}

              .empty {{
                display: none;
                padding: 50px 0;
                text-align: center;
                color: var(--muted);
              }}

              .footer {{
                padding: 0 0 36px;
                text-align: center;
                color: #9aa0ad;
                font-size: 13px;
              }}

              @media (max-width: 760px) {{
                .hero {{
                  padding-top: 26px;
                }}

                .hero-box {{
                  padding: 24px 20px;
                }}

                .toolbar-inner {{
                  flex-wrap: wrap;
                }}

                .search {{
                  width: 100%;
                  flex-basis: 100%;
                }}

                .filters {{
                  width: 100%;
                }}

                .grid {{
                  grid-template-columns: 1fr;
                }}
              }}
            </style>
          </head>

          <body>
            <header class="hero">
              <div class="wrap">
                <div class="hero-box">
                  <span class="eyebrow">Tampermonkey Userscripts</span>
                  <h1>WanXin Userscripts</h1>
                  <p class="subtitle">
                    个人维护的用户脚本发布主页。Cloudflare Pages 提供固定安装与自动更新，
                    GitHub 作为唯一开发源。
                  </p>
                  <div class="stats">
                    <span><strong>{len(items)}</strong> 个正式脚本</span>
                    <span>最近修改 <strong>{h(latest_text)}</strong></span>
                    <span>
                      <a href="{h(GITHUB_REPO_URL)}"
                         target="_blank"
                         rel="noopener noreferrer">GitHub 仓库 ↗</a>
                    </span>
                  </div>
                </div>
              </div>
            </header>

            <div class="toolbar">
              <div class="wrap toolbar-inner">
                <input
                  id="search"
                  class="search"
                  type="search"
                  placeholder="搜索脚本名称、说明或 ID..."
                  autocomplete="off"
                >
                <div class="filters">
                  {''.join(buttons)}
                </div>
              </div>
            </div>

            <main class="content">
              <div class="wrap">
                <section class="grid">
                  {''.join(cards)}
                </section>
                <div id="empty" class="empty">没有找到匹配的脚本。</div>
              </div>
            </main>

            <section class="wrap guide">
              <h2>Tampermonkey 使用说明</h2>

              <details open>
                <summary>如何安装脚本</summary>
                <ol>
                  <li>先安装 Tampermonkey。</li>
                  <li>在上方找到需要的脚本，点击“立即安装”。</li>
                  <li>在 Tampermonkey 安装页确认后点击“安装”。</li>
                  <li>打开对应业务页面并刷新即可生效。</li>
                </ol>
              </details>

              <details>
                <summary>如何检查更新</summary>
                <p>
                  打开 Tampermonkey 管理面板，点击“检查用户脚本更新”。
                  脚本通过固定 @updateURL 比较远程与本地 @version，
                  有新版时再通过 @downloadURL 获取更新。
                </p>
              </details>

              <details>
                <summary>新版刚发布但暂时没有检测到</summary>
                <p>
                  请先等待 GitHub Actions 与 Cloudflare Pages 部署完成。
                  如需立即更新，可以重新点击本页“立即安装”覆盖更新。
                </p>
              </details>
            </section>

            <footer class="footer">
              <div class="wrap">
                页面与脚本清单由 GitHub Actions 自动维护
              </div>
            </footer>

            <script>
              (() => {{
                const search = document.getElementById("search");
                const cards = [...document.querySelectorAll(".card")];
                const filters = [...document.querySelectorAll(".filter")];
                const empty = document.getElementById("empty");

                let activeGroup = "all";

                function refresh() {{
                  const query = search.value.trim().toLowerCase();
                  let visible = 0;

                  cards.forEach(card => {{
                    const groupMatch =
                      activeGroup === "all" ||
                      card.dataset.group === activeGroup;

                    const textMatch =
                      !query ||
                      card.dataset.search.includes(query);

                    const show = groupMatch && textMatch;

                    card.classList.toggle("hidden", !show);

                    if (show) {{
                      visible += 1;
                    }}
                  }});

                  empty.style.display = visible ? "none" : "block";
                }}

                filters.forEach(button => {{
                  button.addEventListener("click", () => {{
                    filters.forEach(item => item.classList.remove("active"));
                    button.classList.add("active");
                    activeGroup = button.dataset.group;
                    refresh();
                  }});
                }});

                search.addEventListener("input", refresh);
              }})();
            </script>
          </body>
          </html>
          '''

          INDEX_PATH.write_text(
              html,
              encoding="utf-8",
              newline="\n",
          )

          print(f"README 已生成，共 {len(items)} 个脚本。")
          print(f"Cloudflare 首页已生成：{INDEX_PATH}")
          print(f"首页地址：{BASE_URL}")
          PY

      - name: Commit README And Homepage
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${README_FILE}" "${PUBLISH_DIR}/index.html"

          if git diff --cached --quiet; then
            echo "README 与首页无变化，无需提交。"
            exit 0
          fi

          git commit -m "[auto-readme] 自动更新 README 与脚本主页"
          git push origin "HEAD:${GITHUB_BRANCH}"

          echo "README 与 Cloudflare 脚本主页更新完成。"

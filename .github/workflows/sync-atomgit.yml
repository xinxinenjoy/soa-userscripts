name: Sync to GitCode

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Check GitCode Token
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "错误：GITCODE_TOKEN 为空"
            exit 1
          fi
          echo "GITCODE_TOKEN 已读取"

      - name: Configure GitCode Authentication
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          cat > ~/.netrc <<EOF
          machine gitcode.com
          login gcw_7DpHPfUr
          password ${GITCODE_TOKEN}
          EOF

          chmod 600 ~/.netrc

      - name: Clone GitCode Publish Repository
        run: |
          git clone \
            https://gitcode.com/gcw_7DpHPfUr/soa-userscript.git \
            publish

      - name: Sync GitHub Content to Publish Repository
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            source/ publish/

      - name: Rewrite Userscript Update URLs
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import re

          root = Path("publish")

          BASE_URL = (
              "https://raw.gitcode.com/"
              "gcw_7DpHPfUr/"
              "soa-userscript/"
              "raw/main/"
          )

          scripts = sorted(root.rglob("*.user.js"))

          if not scripts:
              print("未发现 .user.js 文件，无需修改更新地址。")
              raise SystemExit(0)

          for path in scripts:
              relative = path.relative_to(root)

              encoded_path = "/".join(
                  quote(part, safe="._-")
                  for part in relative.parts
              )

              raw_url = BASE_URL + encoded_path

              text = path.read_text(encoding="utf-8-sig")

              update_line = f"// @updateURL    {raw_url}"
              download_line = f"// @downloadURL  {raw_url}"

              update_pattern = re.compile(
                  r"(?m)^//\s*@updateURL\s+.*$"
              )
              download_pattern = re.compile(
                  r"(?m)^//\s*@downloadURL\s+.*$"
              )

              has_update = bool(update_pattern.search(text))
              has_download = bool(download_pattern.search(text))

              if has_update:
                  text = update_pattern.sub(
                      update_line,
                      text,
                      count=1
                  )

              if has_download:
                  text = download_pattern.sub(
                      download_line,
                      text,
                      count=1
                  )

              missing_lines = []

              if not has_update:
                  missing_lines.append(update_line)

              if not has_download:
                  missing_lines.append(download_line)

              if missing_lines:
                  marker = "// ==/UserScript=="

                  if marker not in text:
                      print(
                          f"警告：{relative} 未找到 Userscript 元数据结束标记，"
                          "无法自动插入更新地址。"
                      )
                  else:
                      block = "\n".join(missing_lines) + "\n"
                      text = text.replace(
                          marker,
                          block + marker,
                          1
                      )

              path.write_text(
                  text,
                  encoding="utf-8",
                  newline="\n"
              )

              print(f"已处理：{relative}")
              print(f"  -> {raw_url}")

          print(f"共处理 {len(scripts)} 个 .user.js 文件。")
          PY

      - name: Commit and Push to GitCode
        run: |
          cd publish

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitCode 发布内容无变化，无需提交。"
            exit 0
          fi

          git commit -m "Sync from GitHub ${GITHUB_SHA::7}"
          git push origin main

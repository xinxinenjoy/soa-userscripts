name: Sync to GitCode

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitCode Token
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "错误：GitHub Secret GITCODE_TOKEN 为空"
            exit 1
          fi
          echo "GITCODE_TOKEN 已成功读取"

      - name: Push to GitCode
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          git remote remove gitcode 2>/dev/null || true
          git remote add gitcode "https://gcw_7DpHPfUr:${GITCODE_TOKEN}@gitcode.com/gcw_7DpHPfUr/soa-userscripts.git"

          git push gitcode HEAD:main
          git push gitcode --tags

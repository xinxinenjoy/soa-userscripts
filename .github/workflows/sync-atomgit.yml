name: Sync to GitCode

# ============================================================
# 可复用配置区
# 换项目时通常只需要修改这里
# ============================================================
env:
  GITHUB_BRANCH: main

  GITCODE_OWNER: gcw_7DpHPfUr
  GITCODE_REPO: wanxin-userscripts
  GITCODE_BRANCH: main

  # GitHub Actions -> Settings -> Secrets and variables -> Actions
  # 这里填写 Secret 的“名称”，不是 Token 内容
  GITCODE_SECRET_NAME: GITCODE_TOKEN

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:

# 需要回写 GitHub 原始文件，因此必须允许 contents: write
permissions:
  contents: write

jobs:
  sync:
    # Workflow 自动回写 GitHub 后会产生一个新 push。
    # 带有 [auto-gitcode-url] 的自动提交直接跳过，避免无限循环。
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(github.event.head_commit.message, '[auto-gitcode-url]')
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          fetch-depth: 0
          path: source

      # --------------------------------------------------------
      # 1. 先修改 GitHub 原始 .user.js
      # --------------------------------------------------------
      - name: Verify and Rewrite GitHub Userscript URLs
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import os
          import re
          import sys

          ROOT = Path("source")

          GITCODE_OWNER = os.environ["GITCODE_OWNER"]
          GITCODE_REPO = os.environ["GITCODE_REPO"]
          GITCODE_BRANCH = os.environ["GITCODE_BRANCH"]

          BASE_URL = (
              f"https://raw.gitcode.com/"
              f"{GITCODE_OWNER}/"
              f"{GITCODE_REPO}/"
              f"raw/{GITCODE_BRANCH}/"
          )

          START_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$"
          )
          END_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$"
          )

          TAG_PATTERNS = {
              "updateURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@updateURL(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "downloadURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@downloadURL(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
          }

          scripts = sorted(ROOT.rglob("*.user.js"))

          if not scripts:
              print("未发现 .user.js 文件，无需处理。")
              raise SystemExit(0)

          errors = []

          def build_expected_url(path: Path) -> str:
              """
              GitCode 当前采用与 GitHub 相同的目录结构，
              因此直接根据 GitHub 中脚本的实际相对路径生成 Raw URL。
              """
              relative = path.relative_to(ROOT)

              encoded_path = "/".join(
                  quote(part, safe="._-")
                  for part in relative.parts
              )

              return BASE_URL + encoded_path

          def get_values(metadata: str, tag: str):
              values = []

              for match in TAG_PATTERNS[tag].finditer(metadata):
                  values.append((match.group(1) or "").strip())

              return values

          def remove_tag(metadata: str, tag: str) -> str:
              return TAG_PATTERNS[tag].sub("", metadata)

          for path in scripts:
              relative = path.relative_to(ROOT)
              expected_url = build_expected_url(path)

              try:
                  text = path.read_text(encoding="utf-8-sig")
              except Exception as exc:
                  errors.append(
                      f"{relative}: 无法读取文件：{exc}"
                  )
                  continue

              start_match = START_RE.search(text)
              end_match = END_RE.search(text)

              if (
                  not start_match
                  or not end_match
                  or end_match.start() <= start_match.end()
              ):
                  errors.append(
                      f"{relative}: 未找到完整的 ==UserScript== 元数据区。"
                  )
                  continue

              metadata_start = start_match.start()
              metadata_end = end_match.end()
              metadata = text[metadata_start:metadata_end]

              print("")
              print(f"检查：{relative}")
              print(f"正确地址：{expected_url}")

              for tag in ("updateURL", "downloadURL"):
                  values = get_values(metadata, tag)

                  if not values:
                      print(f"  @{tag}: 缺失，自动添加")
                  elif len(values) > 1:
                      print(
                          f"  @{tag}: 发现 {len(values)} 个重复标签，"
                          "自动清理"
                      )
                  elif values[0] != expected_url:
                      print(f"  @{tag}: 地址不一致，自动修正")
                      print(f"    原值：{values[0] or '(空)'}")
                  else:
                      print(f"  @{tag}: 正确")

              # 无论原来是什么格式，都统一删除旧标签并写入唯一标准值
              cleaned = metadata
              cleaned = remove_tag(cleaned, "updateURL")
              cleaned = remove_tag(cleaned, "downloadURL")

              cleaned = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  cleaned
              )

              end_marker = END_RE.search(cleaned)

              if not end_marker:
                  errors.append(
                      f"{relative}: 元数据结束标记异常。"
                  )
                  continue

              canonical = (
                  f"// @updateURL    {expected_url}\n"
                  f"// @downloadURL  {expected_url}\n"
              )

              cleaned = (
                  cleaned[:end_marker.start()]
                  + canonical
                  + cleaned[end_marker.start():]
              )

              new_text = (
                  text[:metadata_start]
                  + cleaned
                  + text[metadata_end:]
              )

              path.write_text(
                  new_text,
                  encoding="utf-8",
                  newline="\n"
              )

          if errors:
              print("")
              print("以下脚本存在问题，已停止发布：")

              for item in errors:
                  print(f"  - {item}")

              sys.exit(1)

          print("")
          print(f"共检查 {len(scripts)} 个 .user.js 文件。")
          print("GitHub 原始脚本更新地址已全部标准化。")
          PY

      # --------------------------------------------------------
      # 2. 如果 GitHub 原始文件发生变化，就自动提交回 GitHub
      # --------------------------------------------------------
      - name: Commit URL Changes Back to GitHub
        run: |
          cd source

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitHub 原始文件中的更新地址均已正确，无需回写。"
            exit 0
          fi

          git commit \
            -m "[auto-gitcode-url] 自动更新 Userscript GitCode 地址"

          git push \
            origin \
            "HEAD:${GITHUB_BRANCH}"

          echo "GitHub 原始文件已自动更新。"

      # --------------------------------------------------------
      # 3. 检查 GitCode Token
      # --------------------------------------------------------
      - name: Load and Check GitCode Secret
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "错误：未读取到 GitCode Token"
            echo "当前 Secret 名称：${GITCODE_SECRET_NAME}"
            exit 1
          fi

          echo "GitCode Token 已读取"
          echo "Secret 名称：${GITCODE_SECRET_NAME}"

      - name: Configure GitCode Authentication
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        run: |
          cat > ~/.netrc <<EOF
          machine gitcode.com
          login ${GITCODE_OWNER}
          password ${GITCODE_TOKEN}
          EOF

          chmod 600 ~/.netrc

      # --------------------------------------------------------
      # 4. 克隆 GitCode 发布仓库
      # --------------------------------------------------------
      - name: Clone GitCode Publish Repository
        run: |
          echo "目标 GitCode 仓库：${GITCODE_OWNER}/${GITCODE_REPO}"
          echo "目标分支：${GITCODE_BRANCH}"

          git clone \
            --branch "${GITCODE_BRANCH}" \
            "https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git" \
            publish

      # --------------------------------------------------------
      # 5. 将已经修正过 URL 的 GitHub 内容同步到 GitCode
      # --------------------------------------------------------
      - name: Sync GitHub Content to GitCode
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            source/ publish/

      # --------------------------------------------------------
      # 6. 提交并推送 GitCode
      # --------------------------------------------------------
      - name: Commit and Push to GitCode
        run: |
          cd publish

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitCode 内容无变化，无需提交。"
            exit 0
          fi

          git commit \
            -m "Sync from GitHub ${GITHUB_SHA::7}"

          git push \
            origin \
            "${GITCODE_BRANCH}"

          echo "GitCode 同步完成。"

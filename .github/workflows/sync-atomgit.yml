name: Sync to GitCode

# ============================================================
# 可复用配置区
# 换到其他项目时，通常只需要修改这里
# ============================================================
env:
  GITCODE_OWNER: gcw_7DpHPfUr
  GITCODE_REPO: wanxin-userscripts
  GITCODE_BRANCH: main
  GITCODE_SECRET_NAME: GITCODE_TOKEN

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: source

      - name: Load and Check GitCode Secret
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "错误：未读取到 GitCode Token"
            echo "当前配置的 Secret 名称：${GITCODE_SECRET_NAME}"
            echo "请确认 GitHub 仓库 Settings -> Secrets and variables -> Actions 中存在该 Secret"
            exit 1
          fi

          echo "GitCode Token 已读取"
          echo "Secret 名称：${GITCODE_SECRET_NAME}"

      - name: Configure GitCode Authentication
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        run: |
          cat > ~/.netrc <<EOF
          machine gitcode.com
          login ${GITCODE_OWNER}
          password ${GITCODE_TOKEN}
          EOF

          chmod 600 ~/.netrc

      - name: Clone GitCode Publish Repository
        run: |
          echo "目标 GitCode 仓库：${GITCODE_OWNER}/${GITCODE_REPO}"
          echo "目标分支：${GITCODE_BRANCH}"

          git clone \
            --branch "${GITCODE_BRANCH}" \
            "https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git" \
            publish

      - name: Sync GitHub Content to Publish Repository
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            source/ publish/

      - name: Verify and Rewrite Userscript Update URLs
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import os
          import re
          import sys

          ROOT = Path("publish")

          GITCODE_OWNER = os.environ["GITCODE_OWNER"]
          GITCODE_REPO = os.environ["GITCODE_REPO"]
          GITCODE_BRANCH = os.environ["GITCODE_BRANCH"]

          BASE_URL = (
              f"https://raw.gitcode.com/"
              f"{GITCODE_OWNER}/"
              f"{GITCODE_REPO}/"
              f"raw/{GITCODE_BRANCH}/"
          )

          START_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$"
          )
          END_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$"
          )

          TAG_PATTERNS = {
              "updateURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@updateURL(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "downloadURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@downloadURL(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
          }

          scripts = sorted(ROOT.rglob("*.user.js"))

          if not scripts:
              print("未发现 .user.js 文件，无需处理。")
              raise SystemExit(0)

          errors = []

          def build_expected_url(path: Path) -> str:
              """
              根据脚本在 GitCode 发布仓库中的实际相对路径
              自动生成唯一正确的 Raw URL。
              """
              relative = path.relative_to(ROOT)

              encoded_path = "/".join(
                  quote(part, safe="._-")
                  for part in relative.parts
              )

              return BASE_URL + encoded_path

          def get_tag_urls(metadata: str, tag: str):
              values = []

              for match in TAG_PATTERNS[tag].finditer(metadata):
                  value = (match.group(1) or "").strip()
                  values.append(value)

              return values

          def remove_tag_lines(metadata: str, tag: str) -> str:
              return TAG_PATTERNS[tag].sub("", metadata)

          for path in scripts:
              relative = path.relative_to(ROOT)
              expected_url = build_expected_url(path)

              try:
                  text = path.read_text(encoding="utf-8-sig")
              except Exception as exc:
                  errors.append(
                      f"{relative}: 无法读取文件：{exc}"
                  )
                  continue

              start_match = START_RE.search(text)
              end_match = END_RE.search(text)

              if (
                  not start_match
                  or not end_match
                  or end_match.start() <= start_match.end()
              ):
                  errors.append(
                      f"{relative}: 未找到完整的 ==UserScript== 元数据区，已跳过。"
                  )
                  continue

              metadata_start = start_match.start()
              metadata_end = end_match.end()
              metadata = text[metadata_start:metadata_end]

              print("")
              print(f"处理：{relative}")
              print(f"目标：{expected_url}")

              statuses = {}

              for tag in ("updateURL", "downloadURL"):
                  values = get_tag_urls(metadata, tag)

                  if len(values) == 0:
                      statuses[tag] = "缺失，自动添加"

                  elif len(values) == 1 and values[0] == expected_url:
                      statuses[tag] = "已正确，无需修正"

                  elif len(values) == 1:
                      statuses[tag] = (
                          f"地址不一致，自动修正\n"
                          f"    原值：{values[0] or '(空)'}"
                      )

                  else:
                      statuses[tag] = (
                          f"发现 {len(values)} 个重复标签，"
                          "自动清理并保留唯一正确地址"
                      )

              # 删除所有旧的 updateURL / downloadURL
              cleaned = metadata
              cleaned = remove_tag_lines(
                  cleaned,
                  "updateURL"
              )
              cleaned = remove_tag_lines(
                  cleaned,
                  "downloadURL"
              )

              # 清理删除标签后可能产生的连续空行
              cleaned = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  cleaned
              )

              end_marker = END_RE.search(cleaned)

              if not end_marker:
                  errors.append(
                      f"{relative}: 清理后元数据结束标记异常，已跳过写入。"
                  )
                  continue

              canonical_block = (
                  f"// @updateURL    {expected_url}\n"
                  f"// @downloadURL  {expected_url}\n"
              )

              # 在元数据结束标记前统一写入正确地址
              cleaned = (
                  cleaned[:end_marker.start()]
                  + canonical_block
                  + cleaned[end_marker.start():]
              )

              new_text = (
                  text[:metadata_start]
                  + cleaned
                  + text[metadata_end:]
              )

              path.write_text(
                  new_text,
                  encoding="utf-8",
                  newline="\n"
              )

              print(
                  f"  @updateURL   ："
                  f"{statuses['updateURL']}"
              )
              print(
                  f"  @downloadURL ："
                  f"{statuses['downloadURL']}"
              )

          print("")
          print(
              f"共检测 {len(scripts)} 个 .user.js 文件。"
          )

          if errors:
              print("")
              print("以下脚本处理失败：")

              for item in errors:
                  print(f"  - {item}")

              # 防止有问题的脚本继续发布
              sys.exit(1)

          print(
              "所有脚本更新地址均已核对并标准化。"
          )
          print(
              f"当前 Raw 基础地址：{BASE_URL}"
          )
          PY

      - name: Commit and Push to GitCode
        run: |
          cd publish

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitCode 发布内容无变化，无需提交。"
            exit 0
          fi

          git commit \
            -m "Sync from GitHub ${GITHUB_SHA::7}"

          git push \
            origin \
            "${GITCODE_BRANCH}"

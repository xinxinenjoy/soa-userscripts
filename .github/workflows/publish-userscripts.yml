name: Publish Userscripts to GitCode

# ============================================================
# WanXin Userscripts 自动发布
#
# 核心规则：
# 1. GitHub main 是唯一开发源
# 2. 源脚本可以放在任意目录、任意改名
# 3. 每个脚本通过 @publishID 获得永久发布地址
# 4. 没有 @publishID 时，首次运行自动生成并写回源脚本
# 5. 最终稳定地址统一为：
#      publish/<publishID>.user.js
# 6. @updateURL / @downloadURL 永远指向稳定 publish 地址
# 7. README 自动维护
# 8. GitHub 完整镜像到 GitCode
# ============================================================

env:
  GITHUB_BRANCH: main

  GITCODE_OWNER: gcw_7DpHPfUr
  GITCODE_REPO: wanxin-userscripts
  GITCODE_BRANCH: main

  # GitHub:
  # Settings -> Secrets and variables -> Actions
  GITCODE_SECRET_NAME: GITCODE_TOKEN

  USERSCRIPT_AUTHOR: WanXin

  README_FILE: README.md

  # Workflow 自动生成目录，请勿手工维护
  PUBLISH_DIR: publish

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */4 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-userscripts-gitcode
  cancel-in-progress: false

jobs:
  publish:
    # 自动维护 Commit 会再次触发 push。
    # 对自动维护提交跳过，避免无限循环。
    if: >-
      ${{
        github.event_name != 'push' ||
        !contains(
          github.event.head_commit.message,
          '[auto-userscript-maintenance]'
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          fetch-depth: 0
          path: source

      # ========================================================
      # 1. 维护源脚本 + 生成固定 publish 目录 + README
      # ========================================================
      - name: Maintain and Build Userscripts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import hashlib
          import os
          import re
          import shutil
          import sys
          import unicodedata

          ROOT = Path("source")
          README_PATH = ROOT / os.environ.get(
              "README_FILE",
              "README.md"
          )

          PUBLISH_DIR = os.environ.get(
              "PUBLISH_DIR",
              "publish"
          )

          PUBLISH_ROOT = ROOT / PUBLISH_DIR

          GITCODE_OWNER = os.environ["GITCODE_OWNER"]
          GITCODE_REPO = os.environ["GITCODE_REPO"]
          GITCODE_BRANCH = os.environ["GITCODE_BRANCH"]

          USERSCRIPT_AUTHOR = os.environ.get(
              "USERSCRIPT_AUTHOR",
              "WanXin"
          )

          GITHUB_REPOSITORY = os.environ.get(
              "GITHUB_REPOSITORY",
              ""
          )

          GITHUB_BRANCH = os.environ.get(
              "GITHUB_BRANCH",
              "main"
          )

          GITCODE_RAW_BASE = (
              f"https://raw.gitcode.com/"
              f"{GITCODE_OWNER}/"
              f"{GITCODE_REPO}/"
              f"raw/{GITCODE_BRANCH}/"
          )

          GITHUB_RAW_BASE = (
              f"https://raw.githubusercontent.com/"
              f"{GITHUB_REPOSITORY}/"
              f"{GITHUB_BRANCH}/"
          )

          START_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$"
          )

          END_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$"
          )

          META_LINE_RE = re.compile(
              r"^[ \t]*//[ \t]*@"
              r"([A-Za-z0-9:_-]+)"
              r"(?:[ \t]+(.*?))?"
              r"[ \t]*$"
          )

          TAG_PATTERNS = {
              "author": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@author"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "publishID": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@publishID"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "updateURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@updateURL"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "downloadURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@downloadURL"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
          }

          PUBLISH_ID_RE = re.compile(
              r"^[A-Za-z0-9]"
              r"[A-Za-z0-9._-]{0,79}$"
          )

          AUTO_START = "<!-- AUTO-USERSCRIPTS:START -->"
          AUTO_END = "<!-- AUTO-USERSCRIPTS:END -->"


          def is_source_userscript(path: Path) -> bool:
              if not path.name.endswith(".user.js"):
                  return False

              try:
                  relative = path.relative_to(ROOT)
              except ValueError:
                  return False

              # publish/ 完全由 Workflow 生成，
              # 绝不能把发布副本再次当成源脚本扫描。
              if (
                  relative.parts
                  and relative.parts[0] == PUBLISH_DIR
              ):
                  return False

              return True


          scripts = sorted(
              path
              for path in ROOT.rglob("*.user.js")
              if is_source_userscript(path)
          )

          if not scripts:
              print("未发现源 .user.js 文件，无需处理。")
              raise SystemExit(0)


          def parse_metadata(metadata: str):
              result = {}

              for line in metadata.splitlines():
                  match = META_LINE_RE.match(line)

                  if not match:
                      continue

                  key = match.group(1)
                  value = (match.group(2) or "").strip()

                  result.setdefault(
                      key,
                      []
                  ).append(value)

              return result


          def first(meta, key, default=""):
              values = meta.get(key) or []
              return values[0] if values else default


          def clean_tag(metadata: str, tag: str) -> str:
              return TAG_PATTERNS[tag].sub(
                  "",
                  metadata
              )


          def md_escape(value: str) -> str:
              return (
                  str(value)
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .strip()
              )


          def make_auto_publish_id(relative: Path) -> str:
              """
              首次运行没有 @publishID 时自动生成。

              示例：
                SOA.2.1全局发票页面.user.js
                -> soa-2-1-a1b2c3d4

              一旦写入源文件，以后即使源文件改名/移动，
              ID 也不会再次变化。
              """
              name = relative.name

              if name.endswith(".user.js"):
                  name = name[:-8]

              normalized = unicodedata.normalize(
                  "NFKD",
                  name
              )

              ascii_name = (
                  normalized
                  .encode(
                      "ascii",
                      "ignore"
                  )
                  .decode("ascii")
                  .lower()
              )

              slug = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  ascii_name
              )

              slug = re.sub(
                  r"-+",
                  "-",
                  slug
              ).strip("-")

              if not slug:
                  slug = "script"

              slug = slug[:48].rstrip("-")

              digest = hashlib.sha1(
                  relative.as_posix().encode("utf-8")
              ).hexdigest()[:8]

              return f"{slug}-{digest}"


          def encoded_publish_path(
              publish_id: str
          ) -> str:
              filename = f"{publish_id}.user.js"

              return (
                  f"{quote(PUBLISH_DIR, safe='._-')}/"
                  f"{quote(filename, safe='._-')}"
              )


          def build_gitcode_url(
              publish_id: str
          ) -> str:
              return (
                  GITCODE_RAW_BASE
                  + encoded_publish_path(
                      publish_id
                  )
              )


          def build_github_url(
              publish_id: str
          ) -> str:
              return (
                  GITHUB_RAW_BASE
                  + encoded_publish_path(
                      publish_id
                  )
              )


          prepared = []
          errors = []
          used_ids = {}


          for path in scripts:
              relative = path.relative_to(ROOT)

              try:
                  text = path.read_text(
                      encoding="utf-8-sig"
                  )
              except Exception as exc:
                  errors.append(
                      f"{relative}: 无法读取：{exc}"
                  )
                  continue

              start_match = START_RE.search(text)
              end_match = END_RE.search(text)

              if (
                  not start_match
                  or not end_match
                  or end_match.start() <= start_match.end()
              ):
                  errors.append(
                      f"{relative}: "
                      "未找到完整 ==UserScript== 元数据区。"
                  )
                  continue

              metadata_start = start_match.start()
              metadata_end = end_match.end()

              metadata = text[
                  metadata_start:
                  metadata_end
              ]

              original_meta = parse_metadata(
                  metadata
              )

              publish_values = (
                  original_meta.get(
                      "publishID"
                  )
                  or []
              )

              if len(publish_values) > 1:
                  errors.append(
                      f"{relative}: "
                      "发现多个 @publishID，请只保留一个。"
                  )
                  continue

              publish_id = (
                  publish_values[0].strip()
                  if publish_values
                  else ""
              )

              auto_created = False

              if not publish_id:
                  publish_id = make_auto_publish_id(
                      relative
                  )
                  auto_created = True

              if not PUBLISH_ID_RE.fullmatch(
                  publish_id
              ):
                  errors.append(
                      f"{relative}: "
                      f"@publishID '{publish_id}' 不合法。"
                      "只允许英文字母、数字、点、横线、下划线，"
                      "长度 1-80。"
                  )
                  continue

              key = publish_id.lower()

              if key in used_ids:
                  errors.append(
                      f"@publishID 重复：'{publish_id}'\n"
                      f"  - {used_ids[key]}\n"
                      f"  - {relative}"
                  )
                  continue

              used_ids[key] = relative

              expected_url = build_gitcode_url(
                  publish_id
              )

              github_backup_url = build_github_url(
                  publish_id
              )

              print("")
              print(f"检查：{relative}")
              print(f"publishID：{publish_id}")

              if auto_created:
                  print(
                      "  @publishID: 缺失，"
                      "已自动生成并永久写入"
                  )
              else:
                  print(
                      "  @publishID: 已存在，保持不变"
                  )

              print(
                  f"  固定发布地址：{expected_url}"
              )

              cleaned = metadata

              for tag in (
                  "author",
                  "publishID",
                  "updateURL",
                  "downloadURL",
              ):
                  cleaned = clean_tag(
                      cleaned,
                      tag
                  )

              cleaned = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  cleaned
              )

              end_marker = END_RE.search(
                  cleaned
              )

              if not end_marker:
                  errors.append(
                      f"{relative}: "
                      "元数据结束标记异常。"
                  )
                  continue

              canonical = (
                  f"// @author       "
                  f"{USERSCRIPT_AUTHOR}\n"
                  f"// @publishID    "
                  f"{publish_id}\n"
                  f"// @updateURL    "
                  f"{expected_url}\n"
                  f"// @downloadURL  "
                  f"{expected_url}\n"
              )

              cleaned = (
                  cleaned[:end_marker.start()]
                  + canonical
                  + cleaned[end_marker.start():]
              )

              new_text = (
                  text[:metadata_start]
                  + cleaned
                  + text[metadata_end:]
              )

              new_meta = parse_metadata(
                  cleaned
              )

              prepared.append({
                  "source_path": path,
                  "relative": relative,
                  "text": new_text,
                  "publish_id": publish_id,
                  "publish_path": (
                      PUBLISH_ROOT
                      / f"{publish_id}.user.js"
                  ),
                  "name": first(
                      new_meta,
                      "name",
                      path.stem
                  ),
                  "version": first(
                      new_meta,
                      "version",
                      "-"
                  ),
                  "author": first(
                      new_meta,
                      "author",
                      USERSCRIPT_AUTHOR
                  ),
                  "description": first(
                      new_meta,
                      "description",
                      ""
                  ),
                  "gitcode_url": expected_url,
                  "github_url": github_backup_url,
                  "group": (
                      relative.parts[0]
                      if len(relative.parts) > 1
                      else "根目录"
                  ),
              })


          if errors:
              print("")
              print(
                  "发现错误，已停止发布，"
                  "不会生成新的 publish 内容："
              )

              for item in errors:
                  print(f"  - {item}")

              sys.exit(1)


          # ====================================================
          # 所有源脚本验证通过后才真正写文件
          # ====================================================

          # 先回写源脚本
          for info in prepared:
              info["source_path"].write_text(
                  info["text"],
                  encoding="utf-8",
                  newline="\n"
              )

          # publish/ 是纯生成目录。
          # 每次全部重建，可自动删除已移除脚本的旧发布副本。
          if PUBLISH_ROOT.exists():
              shutil.rmtree(
                  PUBLISH_ROOT
              )

          PUBLISH_ROOT.mkdir(
              parents=True,
              exist_ok=True
          )

          for info in prepared:
              info["publish_path"].write_text(
                  info["text"],
                  encoding="utf-8",
                  newline="\n"
              )


          # ====================================================
          # README 自动脚本清单
          # ====================================================
          groups = {}

          for info in prepared:
              groups.setdefault(
                  info["group"],
                  []
              ).append(info)

          lines = [
              AUTO_START,
              "",
              "## 📦 脚本清单",
              "",
              "> 本区域由 GitHub Actions 自动维护。"
              "安装地址固定指向 `publish/`，"
              "源文件改名或移动不会影响已安装脚本的更新。",
              "",
          ]

          for group in sorted(groups):
              lines.extend([
                  f"### {md_escape(group)}",
                  "",
                  "| 脚本 | 版本 | 说明 | GitCode 安装 | GitHub 备用 |",
                  "|---|---:|---|---|---|",
              ])

              for info in sorted(
                  groups[group],
                  key=lambda item: (
                      item["name"].lower(),
                      item["relative"].as_posix().lower()
                  )
              ):
                  lines.append(
                      "| "
                      + f"**{md_escape(info['name'])}** | "
                      + f"{md_escape(info['version'])} | "
                      + f"{md_escape(info['description']) or '-'} | "
                      + f"[安装]({info['gitcode_url']}) | "
                      + f"[备用]({info['github_url']}) |"
                  )

              lines.append("")

          lines.extend([
              f"共收录 **{len(prepared)}** 个 Userscript。",
              "",
              AUTO_END,
          ])

          auto_block = "\n".join(
              lines
          )

          if README_PATH.exists():
              readme = README_PATH.read_text(
                  encoding="utf-8-sig"
              )
          else:
              readme = (
                  "# WanXin Userscripts\n\n"
                  "Tampermonkey / Userscript 脚本仓库。\n"
              )

          if (
              AUTO_START in readme
              and AUTO_END in readme
          ):
              start = readme.index(
                  AUTO_START
              )

              end = (
                  readme.index(
                      AUTO_END
                  )
                  + len(AUTO_END)
              )

              readme = (
                  readme[:start].rstrip()
                  + "\n\n"
                  + auto_block
                  + "\n\n"
                  + readme[end:].lstrip()
              )

          else:
              readme = (
                  readme.rstrip()
                  + "\n\n---\n\n"
                  + auto_block
                  + "\n"
              )

          README_PATH.write_text(
              readme,
              encoding="utf-8",
              newline="\n"
          )

          print("")
          print(
              f"源脚本数量：{len(prepared)}"
          )
          print(
              f"固定发布目录：{PUBLISH_ROOT}"
          )
          print(
              "所有 @updateURL / @downloadURL "
              "已切换到稳定 publish 地址。"
          )
          print(
              f"README 已更新：{README_PATH}"
          )
          PY

      # ========================================================
      # 2. 自动维护结果提交回 GitHub
      # ========================================================
      - name: Commit Maintenance Changes to GitHub
        shell: bash
        run: |
          cd source

          git config \
            user.name \
            "GitHub Actions"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitHub 无需提交自动维护变化。"
            exit 0
          fi

          git commit \
            -m "[auto-userscript-maintenance] 固定发布地址并维护 README"

          git push \
            origin \
            "HEAD:${GITHUB_BRANCH}"

          echo "GitHub 自动维护内容已提交。"

      # ========================================================
      # 3. 检查 GitCode Token
      # ========================================================
      - name: Check GitCode Secret
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        shell: bash
        run: |
          if [ -z "${GITCODE_TOKEN}" ]; then
            echo "错误：未读取到 GitCode Token"
            echo "Secret 名称：${GITCODE_SECRET_NAME}"
            exit 1
          fi

          echo "GitCode Token 已读取。"

      - name: Configure GitCode Authentication
        env:
          GITCODE_TOKEN: ${{ secrets[env.GITCODE_SECRET_NAME] }}
        shell: bash
        run: |
          cat > ~/.netrc <<EOF
          machine gitcode.com
          login ${GITCODE_OWNER}
          password ${GITCODE_TOKEN}
          EOF

          chmod 600 ~/.netrc

      # ========================================================
      # 4. 克隆 GitCode
      # ========================================================
      - name: Clone GitCode
        shell: bash
        run: |
          echo \
            "GitCode：${GITCODE_OWNER}/${GITCODE_REPO}"

          git clone \
            --branch "${GITCODE_BRANCH}" \
            "https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}.git" \
            gitcode

      # ========================================================
      # 5. GitHub 完整镜像到 GitCode
      # ========================================================
      - name: Sync GitHub to GitCode
        shell: bash
        run: |
          rsync -a --delete \
            --exclude=".git/" \
            source/ gitcode/

      # ========================================================
      # 6. 提交 GitCode
      # ========================================================
      - name: Commit and Push GitCode
        shell: bash
        run: |
          cd gitcode

          git config \
            user.name \
            "GitHub Actions"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitCode 内容无变化。"
            exit 0
          fi

          SOURCE_SHA="$(
            git -C ../source \
            rev-parse \
            --short HEAD
          )"

          git commit \
            -m "Sync from GitHub ${SOURCE_SHA}"

          git push \
            origin \
            "${GITCODE_BRANCH}"

          echo "GitCode 同步完成。"

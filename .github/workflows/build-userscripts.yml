name: Build Userscripts

# ============================================================
# WanXin Userscripts 自动构建
#
# 核心规则：
# 1. GitHub main 是唯一开发源
# 2. 源脚本可以放在任意目录、任意改名
# 3. 每个脚本通过 @publishGroup + @publishID 获得永久发布地址
# 4. 没有 @publishGroup 时，根据源一级目录自动生成拼音简称并写回
# 5. 没有 @publishID 时，首次运行自动生成并写回源脚本
# 6. 最终稳定地址统一为：
#      publish/<publishGroup>/<publishID>.user.js
# 7. @updateURL / @downloadURL 永远指向 Cloudflare Pages 自定义域名
# 8. GitCode 仅保留展示镜像，由独立 Workflow 在 README 完成后同步
# ============================================================

env:
  GITHUB_BRANCH: main

  # Tampermonkey 长期固定安装 / 更新域名
  # Cloudflare Pages 的构建输出目录已经设置为 publish，
  # 所以 URL 中不要再带 /publish/。
  DISTRIBUTION_BASE_URL: https://scripts.wanxinxin.dpdns.org

  USERSCRIPT_AUTHOR: WanXin


  # Workflow 自动生成目录，请勿手工维护
  PUBLISH_DIR: publish

  # 网站静态资源源码目录。
  # 图片等资源放这里，由 Flow 自动复制到 publish/assets/。
  SITE_ASSETS_DIR: site-assets

  # 网站脚本截图自动优化参数
  IMAGE_MAX_EDGE: 1920
  IMAGE_WEBP_QUALITY: 88
  IMAGE_THUMB_EDGE: 360
  IMAGE_THUMB_QUALITY: 76

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-userscripts
  cancel-in-progress: false

jobs:
  publish:
    # Build 自己和 README Workflow 都可能产生自动提交。
    # 新版自动提交统一以 [AUTO·...] 标记；同时兼容旧标记，
    # 避免自动提交再次触发 Build。
    if: >-
      ${{
        github.event_name != 'push' ||
        (
          !startsWith(
            github.event.head_commit.message,
            '[AUTO·'
          ) &&
          !contains(
            github.event.head_commit.message,
            '[auto-userscript-maintenance]'
          ) &&
          !contains(
            github.event.head_commit.message,
            '[auto-readme]'
          )
        )
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GITHUB_BRANCH }}
          fetch-depth: 0
          path: source

      # ========================================================
      # 1. 准备中文目录转拼音简称所需依赖
      # ========================================================
      - name: Install Build Dependencies
        shell: bash
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            --quiet \
            pypinyin \
            pillow

      # ========================================================
      # 2. 维护源脚本 + 生成固定 publish 目录
      # ========================================================
      - name: Maintain and Build Userscripts
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import hashlib
          import os
          import re
          import shutil
          import sys
          import unicodedata

          from pypinyin import Style, lazy_pinyin

          ROOT = Path("source")
          README_PATH = ROOT / os.environ.get(
              "README_FILE",
              "README.md"
          )

          PUBLISH_DIR = os.environ.get(
              "PUBLISH_DIR",
              "publish"
          )

          PUBLISH_ROOT = ROOT / PUBLISH_DIR

          SITE_ASSETS_DIR = os.environ.get(
              "SITE_ASSETS_DIR",
              "site-assets"
          )

          SITE_ASSETS_ROOT = ROOT / SITE_ASSETS_DIR
          PUBLISH_ASSETS_ROOT = PUBLISH_ROOT / "assets"

          DISTRIBUTION_BASE_URL = os.environ.get(
              "DISTRIBUTION_BASE_URL",
              "https://scripts.wanxinxin.dpdns.org"
          ).rstrip("/")

          USERSCRIPT_AUTHOR = os.environ.get(
              "USERSCRIPT_AUTHOR",
              "WanXin"
          )

          GITHUB_REPOSITORY = os.environ.get(
              "GITHUB_REPOSITORY",
              ""
          )

          GITHUB_BRANCH = os.environ.get(
              "GITHUB_BRANCH",
              "main"
          )

          GITHUB_RAW_BASE = (
              f"https://raw.githubusercontent.com/"
              f"{GITHUB_REPOSITORY}/"
              f"{GITHUB_BRANCH}/"
          )

          START_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==UserScript==[ \t]*$"
          )

          END_RE = re.compile(
              r"(?m)^[ \t]*//[ \t]*==/UserScript==[ \t]*$"
          )

          META_LINE_RE = re.compile(
              r"^[ \t]*//[ \t]*@"
              r"([A-Za-z0-9:_-]+)"
              r"(?:[ \t]+(.*?))?"
              r"[ \t]*$"
          )

          TAG_PATTERNS = {
              "author": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@author"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "publishID": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@publishID"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "publishGroup": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@publishGroup"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "updateURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@updateURL"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
              "downloadURL": re.compile(
                  r"(?m)^[ \t]*//[ \t]*@downloadURL"
                  r"(?:[ \t]+([^\r\n]*))?[ \t]*$"
              ),
          }

          PUBLISH_ID_RE = re.compile(
              r"^[A-Za-z0-9]"
              r"[A-Za-z0-9._-]{0,79}$"
          )

          PUBLISH_GROUP_RE = re.compile(
              r"^[A-Za-z0-9]"
              r"[A-Za-z0-9._-]{0,39}$"
          )

          def is_source_userscript(path: Path) -> bool:
              if not path.name.endswith(".user.js"):
                  return False

              try:
                  relative = path.relative_to(ROOT)
              except ValueError:
                  return False

              # publish/ 完全由 Workflow 生成，
              # 绝不能把发布副本再次当成源脚本扫描。
              if (
                  relative.parts
                  and relative.parts[0] == PUBLISH_DIR
              ):
                  return False

              return True


          scripts = sorted(
              path
              for path in ROOT.rglob("*.user.js")
              if is_source_userscript(path)
          )

          if not scripts:
              print("未发现源 .user.js 文件，无需处理。")
              raise SystemExit(0)


          def parse_metadata(metadata: str):
              result = {}

              for line in metadata.splitlines():
                  match = META_LINE_RE.match(line)

                  if not match:
                      continue

                  key = match.group(1)
                  value = (match.group(2) or "").strip()

                  result.setdefault(
                      key,
                      []
                  ).append(value)

              return result


          def first(meta, key, default=""):
              values = meta.get(key) or []
              return values[0] if values else default


          def clean_tag(metadata: str, tag: str) -> str:
              return TAG_PATTERNS[tag].sub(
                  "",
                  metadata
              )


          def md_escape(value: str) -> str:
              return (
                  str(value)
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\r", " ")
                  .replace("\n", " ")
                  .strip()
              )


          def make_auto_publish_id(relative: Path) -> str:
              """
              首次运行没有 @publishID 时自动生成。

              示例：
                SOA.2.1全局发票页面.user.js
                -> soa-2-1-a1b2c3d4

              一旦写入源文件，以后即使源文件改名/移动，
              ID 也不会再次变化。
              """
              name = relative.name

              if name.endswith(".user.js"):
                  name = name[:-8]

              normalized = unicodedata.normalize(
                  "NFKD",
                  name
              )

              ascii_name = (
                  normalized
                  .encode(
                      "ascii",
                      "ignore"
                  )
                  .decode("ascii")
                  .lower()
              )

              slug = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  ascii_name
              )

              slug = re.sub(
                  r"-+",
                  "-",
                  slug
              ).strip("-")

              if not slug:
                  slug = "script"

              slug = slug[:48].rstrip("-")

              digest = hashlib.sha1(
                  relative.as_posix().encode("utf-8")
              ).hexdigest()[:8]

              return f"{slug}-{digest}"


          def make_auto_publish_group(relative: Path) -> str:
              """
              根据源文件一级目录生成稳定发布分类。

              规则：
              - 根目录脚本 -> root
              - 纯英文/数字目录 -> 转小写短横线
              - 含中文 -> 中文使用拼音首字母，英文数字原样保留

              示例：
                SOA相关        -> soaxg
                青龙脚本       -> qljb
                游戏相关       -> yxxg
                tools         -> tools

              生成后会写回 @publishGroup，
              后续即使源文件移动目录也不会变化。
              """
              if len(relative.parts) <= 1:
                  return "root"

              raw = relative.parts[0].strip()

              pieces = []

              for char in raw:
                  if char.isascii() and char.isalnum():
                      pieces.append(char.lower())
                      continue

                  if char in "._-":
                      pieces.append("-")
                      continue

                  if "\u4e00" <= char <= "\u9fff":
                      initials = lazy_pinyin(
                          char,
                          style=Style.FIRST_LETTER,
                          strict=False
                      )

                      if initials and initials[0]:
                          pieces.append(
                              initials[0][0].lower()
                          )

              group = "".join(pieces)

              group = re.sub(
                  r"[^a-z0-9._-]+",
                  "-",
                  group
              )

              group = re.sub(
                  r"-+",
                  "-",
                  group
              ).strip("-._")

              if not group:
                  group = "group"

              return group[:40].rstrip("-._") or "group"


          def encoded_publish_path(
              publish_group: str,
              publish_id: str
          ) -> str:
              filename = f"{publish_id}.user.js"

              return (
                  f"{quote(PUBLISH_DIR, safe='._-')}/"
                  f"{quote(publish_group, safe='._-')}/"
                  f"{quote(filename, safe='._-')}"
              )


          def build_distribution_url(
              publish_group: str,
              publish_id: str
          ) -> str:
              # Cloudflare Pages 的网站根目录就是 GitHub 的 publish/，
              # 因此对外地址为：/<publishGroup>/<publishID>.user.js
              filename = f"{publish_id}.user.js"

              return (
                  f"{DISTRIBUTION_BASE_URL}/"
                  f"{quote(publish_group, safe='._-')}/"
                  f"{quote(filename, safe='._-')}"
              )


          def build_github_url(
              publish_group: str,
              publish_id: str
          ) -> str:
              return (
                  GITHUB_RAW_BASE
                  + encoded_publish_path(
                      publish_group,
                      publish_id
                  )
              )


          prepared = []
          errors = []
          used_ids = {}
          used_publish_paths = {}


          for path in scripts:
              relative = path.relative_to(ROOT)

              try:
                  text = path.read_text(
                      encoding="utf-8-sig"
                  )
              except Exception as exc:
                  errors.append(
                      f"{relative}: 无法读取：{exc}"
                  )
                  continue

              start_match = START_RE.search(text)
              end_match = END_RE.search(text)

              if (
                  not start_match
                  or not end_match
                  or end_match.start() <= start_match.end()
              ):
                  errors.append(
                      f"{relative}: "
                      "未找到完整 ==UserScript== 元数据区。"
                  )
                  continue

              metadata_start = start_match.start()
              metadata_end = end_match.end()

              metadata = text[
                  metadata_start:
                  metadata_end
              ]

              original_meta = parse_metadata(
                  metadata
              )

              publish_values = (
                  original_meta.get(
                      "publishID"
                  )
                  or []
              )

              if len(publish_values) > 1:
                  errors.append(
                      f"{relative}: "
                      "发现多个 @publishID，请只保留一个。"
                  )
                  continue

              publish_id = (
                  publish_values[0].strip()
                  if publish_values
                  else ""
              )

              auto_created = False

              if not publish_id:
                  publish_id = make_auto_publish_id(
                      relative
                  )
                  auto_created = True

              group_values = (
                  original_meta.get(
                      "publishGroup"
                  )
                  or []
              )

              if len(group_values) > 1:
                  errors.append(
                      f"{relative}: "
                      "发现多个 @publishGroup，请只保留一个。"
                  )
                  continue

              publish_group = (
                  group_values[0].strip()
                  if group_values
                  else ""
              )

              group_auto_created = False

              if not publish_group:
                  publish_group = make_auto_publish_group(
                      relative
                  )
                  group_auto_created = True

              if not PUBLISH_GROUP_RE.fullmatch(
                  publish_group
              ):
                  errors.append(
                      f"{relative}: "
                      f"@publishGroup '{publish_group}' 不合法。"
                      "只允许英文字母、数字、点、横线、下划线，"
                      "长度 1-40。"
                  )
                  continue

              if not PUBLISH_ID_RE.fullmatch(
                  publish_id
              ):
                  errors.append(
                      f"{relative}: "
                      f"@publishID '{publish_id}' 不合法。"
                      "只允许英文字母、数字、点、横线、下划线，"
                      "长度 1-80。"
                  )
                  continue

              key = publish_id.lower()

              if key in used_ids:
                  errors.append(
                      f"@publishID 重复：'{publish_id}'\n"
                      f"  - {used_ids[key]}\n"
                      f"  - {relative}"
                  )
                  continue

              used_ids[key] = relative

              publish_relative = (
                  Path(PUBLISH_DIR)
                  / publish_group
                  / f"{publish_id}.user.js"
              )

              publish_path_key = (
                  publish_relative
                  .as_posix()
                  .lower()
              )

              if publish_path_key in used_publish_paths:
                  errors.append(
                      "最终发布路径重复："
                      f"'{publish_relative.as_posix()}'\n"
                      f"  - {used_publish_paths[publish_path_key]}\n"
                      f"  - {relative}"
                  )
                  continue

              used_publish_paths[publish_path_key] = relative

              expected_url = build_distribution_url(
                  publish_group,
                  publish_id
              )

              github_backup_url = build_github_url(
                  publish_group,
                  publish_id
              )

              print("")
              print(f"检查：{relative}")
              print(f"publishGroup：{publish_group}")
              print(f"publishID：{publish_id}")

              if group_auto_created:
                  print(
                      "  @publishGroup: 缺失，"
                      "已根据一级目录生成拼音简称并永久写入"
                  )
              else:
                  print(
                      "  @publishGroup: 已存在，保持不变"
                  )

              if auto_created:
                  print(
                      "  @publishID: 缺失，"
                      "已自动生成并永久写入"
                  )
              else:
                  print(
                      "  @publishID: 已存在，保持不变"
                  )

              print(
                  f"  固定发布地址：{expected_url}"
              )

              cleaned = metadata

              for tag in (
                  "author",
                  "publishGroup",
                  "publishID",
                  "updateURL",
                  "downloadURL",
              ):
                  cleaned = clean_tag(
                      cleaned,
                      tag
                  )

              cleaned = re.sub(
                  r"\n{3,}",
                  "\n\n",
                  cleaned
              )

              end_marker = END_RE.search(
                  cleaned
              )

              if not end_marker:
                  errors.append(
                      f"{relative}: "
                      "元数据结束标记异常。"
                  )
                  continue

              canonical = (
                  f"// @author       "
                  f"{USERSCRIPT_AUTHOR}\n"
                  f"// @publishGroup "
                  f"{publish_group}\n"
                  f"// @publishID    "
                  f"{publish_id}\n"
                  f"// @updateURL    "
                  f"{expected_url}\n"
                  f"// @downloadURL  "
                  f"{expected_url}\n"
              )

              cleaned = (
                  cleaned[:end_marker.start()]
                  + canonical
                  + cleaned[end_marker.start():]
              )

              new_text = (
                  text[:metadata_start]
                  + cleaned
                  + text[metadata_end:]
              )

              new_meta = parse_metadata(
                  cleaned
              )

              prepared.append({
                  "source_path": path,
                  "relative": relative,
                  "text": new_text,
                  "publish_group": publish_group,
                  "publish_id": publish_id,
                  "publish_path": (
                      PUBLISH_ROOT
                      / publish_group
                      / f"{publish_id}.user.js"
                  ),
                  "name": first(
                      new_meta,
                      "name",
                      path.stem
                  ),
                  "version": first(
                      new_meta,
                      "version",
                      "-"
                  ),
                  "author": first(
                      new_meta,
                      "author",
                      USERSCRIPT_AUTHOR
                  ),
                  "description": first(
                      new_meta,
                      "description",
                      ""
                  ),
                  "distribution_url": expected_url,
                  "github_url": github_backup_url,
                  "group": publish_group,
              })


          if errors:
              print("")
              print(
                  "发现错误，已停止发布，"
                  "不会生成新的 publish 内容："
              )

              for item in errors:
                  print(f"  - {item}")

              sys.exit(1)


          # ====================================================
          # 所有源脚本验证通过后才真正写文件
          # ====================================================

          # 先回写源脚本
          for info in prepared:
              info["source_path"].write_text(
                  info["text"],
                  encoding="utf-8",
                  newline="\n"
              )

          # publish/ 是纯生成目录。
          # 每次全部重建，可自动删除已移除脚本的旧发布副本。
          if PUBLISH_ROOT.exists():
              shutil.rmtree(
                  PUBLISH_ROOT
              )

          PUBLISH_ROOT.mkdir(
              parents=True,
              exist_ok=True
          )

          for info in prepared:
              info["publish_path"].parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              info["publish_path"].write_text(
                  info["text"],
                  encoding="utf-8",
                  newline="\n"
              )

          print("")
          print(
              f"源脚本数量：{len(prepared)}"
          )
          print(
              f"固定发布目录：{PUBLISH_ROOT}"
          )
          print(
              "所有 @updateURL / @downloadURL "
              "已切换到 Cloudflare Pages 固定域名。"
          )
          print(
              f"Cloudflare 分发根地址：{DISTRIBUTION_BASE_URL}"
          )
          PY

      # ========================================================
      # 3. 自动优化网站图片
      #
      # site-assets/scripts/<publishID>/ 中保存原图。
      # 构建时统一输出：
      #   publish/assets/scripts/<publishID>/<name>.webp
      #   publish/assets/scripts/<publishID>/thumbs/<name>.webp
      #
      # 其它 site-assets/ 内容保持原样复制到 publish/assets/。
      # ========================================================
      - name: Optimize Website Images
        shell: bash
        run: |
          cd source

          python3 <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, UnidentifiedImageError
          import os
          import re
          import shutil

          ROOT = Path(".")

          PUBLISH_DIR = os.environ.get(
              "PUBLISH_DIR",
              "publish"
          )

          SITE_ASSETS_DIR = os.environ.get(
              "SITE_ASSETS_DIR",
              "site-assets"
          )

          MAX_EDGE = max(
              320,
              int(os.environ.get("IMAGE_MAX_EDGE", "1920"))
          )

          WEBP_QUALITY = min(
              100,
              max(
                  50,
                  int(os.environ.get("IMAGE_WEBP_QUALITY", "88"))
              )
          )

          THUMB_EDGE = max(
              120,
              int(os.environ.get("IMAGE_THUMB_EDGE", "360"))
          )

          THUMB_QUALITY = min(
              95,
              max(
                  40,
                  int(os.environ.get("IMAGE_THUMB_QUALITY", "76"))
              )
          )

          SOURCE_ROOT = ROOT / SITE_ASSETS_DIR
          SOURCE_SCRIPT_ROOT = SOURCE_ROOT / "scripts"

          PUBLISH_ROOT = ROOT / PUBLISH_DIR
          OUTPUT_ROOT = PUBLISH_ROOT / "assets"
          OUTPUT_SCRIPT_ROOT = OUTPUT_ROOT / "scripts"

          SOURCE_SUFFIXES = {
              ".png",
              ".jpg",
              ".jpeg",
              ".webp",
              ".gif",
              ".bmp",
              ".tif",
              ".tiff",
          }


          def natural_sort_key(value):
              return [
                  int(part) if part.isdigit() else part.lower()
                  for part in re.split(r"(\d+)", str(value))
              ]


          def readable_size(value):
              size = float(value)

              for unit in ("B", "KB", "MB", "GB"):
                  if size < 1024 or unit == "GB":
                      if unit == "B":
                          return f"{int(size)} {unit}"
                      return f"{size:.1f} {unit}"

                  size /= 1024

              return f"{size:.1f} GB"


          def unique_output_name(stem, used_names):
              clean_stem = str(stem or "image").strip() or "image"
              candidate = f"{clean_stem}.webp"
              number = 2

              while candidate.lower() in used_names:
                  candidate = f"{clean_stem}-{number}.webp"
                  number += 1

              used_names.add(candidate.lower())
              return candidate


          def prepare_image(image):
              # 修复手机照片 / 截图的 EXIF 旋转方向。
              image = ImageOps.exif_transpose(image)

              # 动图用于脚本功能展示时只取第一帧。
              if getattr(image, "is_animated", False):
                  image.seek(0)

              bands = image.getbands()

              if "A" in bands:
                  return image.convert("RGBA")

              return image.convert("RGB")


          def resize_for_web(image, max_edge):
              result = image.copy()

              if max(result.size) > max_edge:
                  result.thumbnail(
                      (max_edge, max_edge),
                      Image.Resampling.LANCZOS
                  )

              return result


          # publish/ 每次已经由上一步整体重建。
          # 这里仍单独清理 assets/，保证删除原图后旧发布图不会残留。
          if OUTPUT_ROOT.exists():
              shutil.rmtree(OUTPUT_ROOT)

          OUTPUT_ROOT.mkdir(
              parents=True,
              exist_ok=True
          )

          if not SOURCE_ROOT.exists():
              print(
                  f"未发现 {SITE_ASSETS_DIR}/，"
                  "跳过网站图片处理。"
              )
              raise SystemExit(0)


          # --------------------------------------------
          # 非 scripts/ 目录中的普通网站资源保持原样复制
          # --------------------------------------------
          for item in sorted(
              SOURCE_ROOT.iterdir(),
              key=lambda path: natural_sort_key(path.name),
          ):
              if item.name == "scripts":
                  continue

              target = OUTPUT_ROOT / item.name

              if item.is_dir():
                  shutil.copytree(
                      item,
                      target,
                      dirs_exist_ok=True
                  )
              elif item.is_file():
                  target.parent.mkdir(
                      parents=True,
                      exist_ok=True
                  )
                  shutil.copy2(
                      item,
                      target
                  )


          if not SOURCE_SCRIPT_ROOT.exists():
              print(
                  "未发现 site-assets/scripts/，"
                  "当前没有脚本图片需要处理。"
              )
              raise SystemExit(0)


          processed_count = 0
          skipped_count = 0
          source_bytes = 0
          output_bytes = 0

          for script_dir in sorted(
              (
                  path
                  for path in SOURCE_SCRIPT_ROOT.iterdir()
                  if path.is_dir()
              ),
              key=lambda path: natural_sort_key(path.name),
          ):
              source_files = sorted(
                  (
                      path
                      for path in script_dir.iterdir()
                      if path.is_file()
                      and not path.name.startswith(".")
                      and path.suffix.lower() in SOURCE_SUFFIXES
                  ),
                  key=lambda path: natural_sort_key(path.name),
              )

              if not source_files:
                  continue

              output_dir = OUTPUT_SCRIPT_ROOT / script_dir.name
              thumb_dir = output_dir / "thumbs"

              output_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              thumb_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              used_names = set()

              print("")
              print(f"处理脚本图片：{script_dir.name}")

              for source in source_files:
                  original_size = source.stat().st_size

                  try:
                      with Image.open(source) as opened:
                          if getattr(opened, "is_animated", False):
                              print(
                                  f"  提示：{source.name} 为动图，"
                                  "网页发布版仅使用第一帧。"
                              )

                          image = prepare_image(opened)

                  except (
                      UnidentifiedImageError,
                      OSError,
                      ValueError
                  ) as exc:
                      skipped_count += 1
                      print(
                          "::warning::"
                          f"无法处理图片 {source.as_posix()}：{exc}"
                      )
                      continue

                  output_name = unique_output_name(
                      source.stem,
                      used_names
                  )

                  output_path = output_dir / output_name
                  thumb_path = thumb_dir / output_name

                  web_image = resize_for_web(
                      image,
                      MAX_EDGE
                  )

                  web_image.save(
                      output_path,
                      "WEBP",
                      quality=WEBP_QUALITY,
                      method=6
                  )

                  thumb_image = resize_for_web(
                      image,
                      THUMB_EDGE
                  )

                  thumb_image.save(
                      thumb_path,
                      "WEBP",
                      quality=THUMB_QUALITY,
                      method=6
                  )

                  published_size = output_path.stat().st_size
                  thumb_size = thumb_path.stat().st_size

                  source_bytes += original_size
                  output_bytes += published_size + thumb_size
                  processed_count += 1

                  print(
                      f"  {source.name}"
                      f" -> {output_name}"
                      f" | {readable_size(original_size)}"
                      f" -> {readable_size(published_size)}"
                      f" + 缩略图 {readable_size(thumb_size)}"
                      f" | {web_image.width}x{web_image.height}"
                  )


          print("")
          print(f"图片处理完成：{processed_count} 张")
          print(f"跳过：{skipped_count} 张")

          if processed_count:
              print(
                  f"原图总大小：{readable_size(source_bytes)}"
              )
              print(
                  f"网页图 + 缩略图：{readable_size(output_bytes)}"
              )
              print(
                  f"网页大图最长边：{MAX_EDGE}px"
                  f" / WebP质量：{WEBP_QUALITY}"
              )
              print(
                  f"缩略图最长边：{THUMB_EDGE}px"
                  f" / WebP质量：{THUMB_QUALITY}"
              )
          PY

      # ========================================================
      # 2. 自动维护结果提交回 GitHub
      # ========================================================
      - name: Commit Maintenance Changes to GitHub
        shell: bash
        run: |
          cd source

          git config \
            user.name \
            "GitHub Actions"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "GitHub 无需提交自动维护变化。"
            exit 0
          fi

          SOURCE_SHA="${GITHUB_SHA}"

          if [[ "${GITHUB_EVENT_NAME}" != "push" ]] ||
             [[ -z "${SOURCE_SHA}" ]] ||
             ! git cat-file -e "${SOURCE_SHA}^{commit}" 2>/dev/null; then
            SOURCE_SHA="$(
              git log \
                --format='%H' \
                --extended-regexp \
                --invert-grep \
                --grep='^(\[AUTO·|\[auto-userscript-maintenance\]|\[auto-readme\])' \
                -n 1
            )"
          fi

          SOURCE_SUBJECT="$(
            git show \
              -s \
              --format='%s' \
              "${SOURCE_SHA}" \
              2>/dev/null ||
            true
          )"

          if [[ -z "${SOURCE_SUBJECT}" ]]; then
            SOURCE_SUBJECT="自动维护脚本发布内容"
          fi

          SOURCE_SUBJECT="${SOURCE_SUBJECT:0:120}"

          git commit \
            -m "[AUTO·发布] ${SOURCE_SUBJECT}" \
            -m "来源提交：${SOURCE_SHA}" \
            -m "自动处理：维护脚本元数据并重新生成 publish 发布文件。"

          git push \
            origin \
            "HEAD:${GITHUB_BRANCH}"

          echo "GitHub 自动发布内容已提交："
          echo "[AUTO·发布] ${SOURCE_SUBJECT}"
